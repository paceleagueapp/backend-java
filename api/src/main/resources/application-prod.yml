server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_URL}
      port: 6379
      password: ${REDIS_PASSWORD}

# 운영에서는 API 문서를 외부에 노출하지 않는다 — Swagger UI/OpenAPI 스펙 엔드포인트를 모두 비활성화(404).
# 로컬(application-local.yml)에서는 그대로 켜져 있어 개발 중에는 계속 사용 가능.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    access-token-ttl-seconds: 300
    refresh-token-ttl-seconds: 1209600
    secret: ${JWT_SECRET}

# H3 도입(2026-09-05) 이전 ACTIVE 땅을 헥사곤으로 백필하는 1회성 startup 배치 스위치.
# TerritoryHexBackfillRunner는 findActiveMissingHex()가 빈 목록이면 아무 일도 안 하는 멱등 로직이라
# 켜둔 채로 둬도 안전하다 — 매 재시작마다 "채울 게 남았는지" 가벼운 조회 한 번만 더 할 뿐.
paceleague:
  territory:
    backfill:
      enabled: true

logging:
  level:
    org.springframework.security: WARN
