plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.paceleague'
version = '0.0.1-SNAPSHOT'
description = 'paceleague'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:translate'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:rekognition'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security' // BCrypt 사용용(인증/인가 안써도 됨)

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1'

    // 땅따먹기 폴리곤 면적/교집합 계산 — 순수 Java, 전이 의존성 없음. (territory.domain.policy.PolygonGeometry)
    implementation 'org.locationtech.jts:jts-core:1.20.0'

    // 땅따먹기 육각형 격자(H3, resolution 12) — JTS와 달리 순수 Java가 아니라 JNI + 플랫폼별 네이티브
    // 바이너리를 내장한다(linux-x64 등, Apache 2.0). 버전은 Maven Central 확인(4.5.0, 2026-09-05 기준 최신).
    implementation 'com.uber:h3:4.5.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
