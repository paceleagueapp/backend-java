<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20260908">
  <link rel="stylesheet" href="/css/admin.css?v=20260910">
  <style>
    .section-title { font-size: 13px; font-weight: 700; color: #8a8e96; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 12px; }
    .version-cards { display: flex; gap: 16px; flex-wrap: wrap; }
    .version-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; width: 300px; }
    .version-card h2 { font-size: 15px; font-weight: 700; color: #1c2024; margin-bottom: 14px; }
    .version-card label { display: block; font-size: 12.5px; color: #8a8e96; margin-top: 10px; margin-bottom: 4px; }
    .version-card input { width: 100%; padding: 9px 10px; border: 1px solid #d7dade; border-radius: 8px; font-size: 13.5px; }
    .version-card button {
      margin-top: 14px; width: 100%; background: #e5342f; color: #fff; border: none; padding: 10px;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .version-card button:hover { background: #c62828; }
    .save-msg { font-size: 12.5px; margin-top: 8px; min-height: 16px; }
    .save-msg.ok { color: #1c8a4a; }
    .save-msg.err { color: #d02b22; }
    .updated-at { font-size: 11.5px; color: #b5b9c0; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <h1>설정</h1>
      <div class="section-title">앱 버전 설정</div>

      <div class="version-cards">
        <div class="version-card" data-platform="ANDROID">
          <h2>Android</h2>
          <label>최신 버전 (latestVersion)</label>
          <input type="text" class="latest-version-input" placeholder="예: 1.3.0">
          <label>최소 지원 버전 (minRequiredVersion)</label>
          <input type="text" class="min-version-input" placeholder="예: 1.0.0">
          <button class="save-btn">저장</button>
          <div class="save-msg"></div>
          <div class="updated-at"></div>
        </div>

        <div class="version-card" data-platform="IOS">
          <h2>iOS</h2>
          <label>최신 버전 (latestVersion)</label>
          <input type="text" class="latest-version-input" placeholder="예: 1.3.0">
          <label>최소 지원 버전 (minRequiredVersion)</label>
          <input type="text" class="min-version-input" placeholder="예: 1.0.0">
          <button class="save-btn">저장</button>
          <div class="save-msg"></div>
          <div class="updated-at"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/admin.js?v=20260910"></script>
  <script>
    function formatDateTime(iso) {
      if (!iso) return '';
      return '마지막 수정: ' + String(iso).slice(0, 16).replace('T', ' ');
    }

    function cardFor(platform) {
      return document.querySelector('.version-card[data-platform="' + platform + '"]');
    }

    function fillCard(platform, summary) {
      var card = cardFor(platform);
      if (!card || !summary) return;
      card.querySelector('.latest-version-input').value = summary.latestVersion || '';
      card.querySelector('.min-version-input').value = summary.minRequiredVersion || '';
      card.querySelector('.updated-at').textContent = formatDateTime(summary.updateAt);
    }

    function loadVersions() {
      adminApiFetch('/api/admin/settings/app-version').then(function (result) {
        if (!result.ok || !result.json.success) return;
        (result.json.data || []).forEach(function (summary) {
          fillCard(summary.platform, summary);
        });
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.version-card'), function (card) {
      var platform = card.getAttribute('data-platform');
      card.querySelector('.save-btn').addEventListener('click', function () {
        var msgEl = card.querySelector('.save-msg');
        var latestVersion = card.querySelector('.latest-version-input').value.trim();
        var minRequiredVersion = card.querySelector('.min-version-input').value.trim();

        msgEl.className = 'save-msg';
        msgEl.textContent = '';

        if (!latestVersion || !minRequiredVersion) {
          msgEl.className = 'save-msg err';
          msgEl.textContent = '두 버전 값을 모두 입력해주세요.';
          return;
        }

        adminApiFetch('/api/admin/settings/app-version/' + platform, {
          method: 'PUT',
          body: { latestVersion: latestVersion, minRequiredVersion: minRequiredVersion }
        }).then(function (result) {
          if (!result.ok || !result.json.success) {
            throw new Error((result.json && result.json.message) || '저장에 실패했습니다.');
          }
          msgEl.className = 'save-msg ok';
          msgEl.textContent = '저장되었습니다.';
          card.querySelector('.updated-at').textContent = formatDateTime(result.json.data.updateAt);
        }).catch(function (err) {
          msgEl.className = 'save-msg err';
          msgEl.textContent = (err && err.message) || '저장에 실패했습니다.';
        });
      });
    });

    requireAdminSession(function () {
      renderAdminLayout('settings');
      document.getElementById('admin-content').hidden = false;
      loadVersions();
    });
  </script>
</body>
</html>
