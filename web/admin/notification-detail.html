<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 상세 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261102">
  <link rel="stylesheet" href="/css/admin.css?v=20261028">
  <style>
    .detail-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 22px; max-width: 760px; margin-bottom: 16px; }
    .detail-card h2 { font-size: 16px; margin: 0 0 12px; }
    .noti-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: #1c2024; }
    .noti-meta { font-size: 12.5px; color: #8a8e96; margin-bottom: 16px; }
    .noti-content { font-size: 14px; line-height: 1.6; color: #1c2024; border-top: 1px solid #f0f1f3; padding-top: 14px; word-break: break-word; }
    .noti-content img, .noti-content video { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
    .noti-content a { color: #2f6fd6; }
    table.data-table { width: 100%; border-collapse: collapse; }
    table.data-table th, table.data-table td { padding: 8px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
    table.data-table th { background: #f7f8fa; color: #4a4e56; font-weight: 700; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .badge.yes { background: #e3f5ea; color: #1c8a4a; }
    .badge.no { background: #f0f1f3; color: #8a8e96; }
    .hint { font-size: 12px; color: #9aa0a8; margin-top: 8px; }
    .back { display: inline-block; margin-top: 4px; padding: 9px 16px; border-radius: 8px; background: #eceef1; color: #4a4e56; font-weight: 700; font-size: 14px; text-decoration: none; }
    .msg { color: #d02b22; font-size: 14px; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <h1>알림 상세</h1>
      <div id="detail"></div>
      <a class="back" href="/admin/notifications">목록</a>
    </main>
  </div>

  <script src="/js/admin.js?v=20261109"></script>
  <script>
    var notificationSno = new URLSearchParams(location.search).get('sno');

    function escapeHtmlAdmin(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDateTime(iso) {
      if (!iso) return '-';
      return String(iso).slice(0, 16).replace('T', ' ');
    }

    function render(d) {
      // content 는 서버가 저장 전에 정제한 HTML(게시글과 같은 허용 태그)이라 그대로 넣는다.
      document.getElementById('detail').innerHTML =
        '<div class="detail-card">' +
          '<div class="noti-title">' + escapeHtmlAdmin(d.title) + '</div>' +
          '<div class="noti-meta">#' + d.sno + ' · ' + formatDateTime(d.createdAt) + ' · 발송 ' + d.sentCount + ' / ' + d.targetCount + '명</div>' +
          '<div class="noti-content">' + d.content + '</div>' +
        '</div>' +
        '<div class="detail-card">' +
          '<h2>받는 회원 (' + d.targetCount + '명)</h2>' +
          '<table class="data-table"><thead><tr><th>회원번호</th><th>닉네임</th><th>푸시</th></tr></thead><tbody>' +
          d.targets.map(function (t) {
            return '<tr>' +
              '<td><a href="/admin/member-detail?sno=' + t.memberSno + '">' + t.memberSno + '</a></td>' +
              '<td>' + escapeHtmlAdmin(t.nickname) + '</td>' +
              '<td>' + (t.sent ? '<span class="badge yes">발송됨</span>' : '<span class="badge no">미발송</span>') + '</td>' +
            '</tr>';
          }).join('') +
          '</tbody></table>' +
          '<div class="hint">미발송: 서비스 알림 거부, 탈퇴, 등록된 FCM 토큰 없음, 또는 발송 실패. 푸시와 상관없이 받는 회원 전원의 알림탭에는 남습니다.</div>' +
        '</div>';
    }

    requireAdminSession(function () {
      renderAdminLayout('notifications');
      document.getElementById('admin-content').hidden = false;
      adminApiFetch('/api/admin/notifications/' + encodeURIComponent(notificationSno)).then(function (result) {
        if (!result.ok || !result.json.success) {
          document.getElementById('detail').innerHTML =
            '<p class="msg">' + escapeHtmlAdmin((result.json && result.json.message) || '알림을 불러오지 못했습니다.') + '</p>';
          return;
        }
        render(result.json.data);
      });
    });
  </script>
</body>
</html>
