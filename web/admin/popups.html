<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팝업관리 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261028">
  <link rel="stylesheet" href="/css/admin.css?v=20261028">
  <style>
    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .page-head h1 { margin-bottom: 0 !important; }
    .new-btn { background: #e5342f; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .new-btn:hover { background: #c62828; }
    table.data-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    table.data-table th, table.data-table td { padding: 10px 14px; text-align: left; font-size: 13.5px; border-bottom: 1px solid #f0f1f3; }
    table.data-table th { background: #f7f8fa; color: #4a4e56; font-weight: 700; }
    table.data-table tbody tr.clickable { cursor: pointer; }
    table.data-table tbody tr.clickable:hover { background: #fafbfc; }
    .empty-row td { text-align: center; color: #8a8e96; padding: 30px; }
    .state { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .state.on { background: #e3f5ea; color: #1c8a4a; }
    .state.scheduled { background: #e8eefc; color: #2f5bd6; }
    .state.ended { background: #f0f1f3; color: #8a8e96; }
    .state.off { background: #fdeceb; color: #d02b22; }
    .target { font-size: 12.5px; color: #4a4e56; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cfd3d8; border-radius: 22px; cursor: pointer; transition: .15s; }
    .switch .slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + .slider { background: #e5342f; }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .pagination { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .pagination button { background: #fff; border: 1px solid #d7dade; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination span { font-size: 13px; color: #4a4e56; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <div class="page-head">
        <h1>팝업관리</h1>
        <a class="new-btn" href="/admin/popup-edit">+ 팝업 등록</a>
      </div>

      <table class="data-table">
        <thead>
          <tr><th>번호</th><th>제목</th><th>노출 대상</th><th>노출 기간 (KST)</th><th>상태</th><th>활성화</th></tr>
        </thead>
        <tbody id="popup-tbody"></tbody>
      </table>

      <div class="pagination">
        <button id="prev-btn">이전</button>
        <span id="page-info"></span>
        <button id="next-btn">다음</button>
      </div>
    </main>
  </div>

  <script src="/js/admin.js?v=20261028"></script>
  <script>
    var currentPage = 0;
    var PAGE_SIZE = 20;
    var TARGET_LABEL = { WEB: '웹', APP: '앱', BOTH: '웹 + 앱' };

    function escapeHtmlAdmin(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDateTime(iso) {
      if (!iso) return '-';
      return String(iso).slice(0, 16).replace('T', ' ');
    }

    // 서버의 visibleNow(활성 + 지금 기간 안)를 기준으로, 아닌 경우만 예정/종료/비활성으로 나눠 보여준다.
    function stateHtml(p) {
      if (!p.active) return '<span class="state off">비활성</span>';
      if (p.visibleNow) return '<span class="state on">노출중</span>';
      var now = new Date();
      return new Date(p.startAt) > now
        ? '<span class="state scheduled">예정</span>'
        : '<span class="state ended">종료</span>';
    }

    function loadPopups() {
      var tbody = document.getElementById('popup-tbody');
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">불러오는 중...</td></tr>';

      adminApiFetch('/api/admin/popups?page=' + currentPage + '&size=' + PAGE_SIZE).then(function (result) {
        if (!result.ok || !result.json.success) {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="6">목록을 불러오지 못했습니다.</td></tr>';
          return;
        }
        var pageData = result.json.data;
        var rows = pageData.content || [];

        tbody.innerHTML = rows.length === 0
          ? '<tr class="empty-row"><td colspan="6">등록된 팝업이 없습니다.</td></tr>'
          : rows.map(function (p) {
              return '<tr class="clickable" data-sno="' + p.sno + '">' +
                '<td>' + p.sno + '</td>' +
                '<td>' + escapeHtmlAdmin(p.title) + '</td>' +
                '<td class="target">' + (TARGET_LABEL[p.target] || p.target) + '</td>' +
                '<td>' + formatDateTime(p.startAt) + ' ~ ' + formatDateTime(p.endAt) + '</td>' +
                '<td>' + stateHtml(p) + '</td>' +
                '<td><label class="switch" title="활성화/비활성화"><input type="checkbox" class="active-toggle" data-sno="' + p.sno + '"' +
                  (p.active ? ' checked' : '') + '><span class="slider"></span></label></td>' +
              '</tr>';
            }).join('');

        Array.prototype.forEach.call(tbody.querySelectorAll('tr.clickable'), function (tr) {
          tr.addEventListener('click', function (e) {
            if (e.target.closest('.switch')) return;
            window.location.href = '/admin/popup-edit?sno=' + tr.getAttribute('data-sno');
          });
        });
        Array.prototype.forEach.call(tbody.querySelectorAll('.active-toggle'), function (input) {
          input.addEventListener('change', function () {
            var sno = input.getAttribute('data-sno');
            input.disabled = true;
            adminApiFetch('/api/admin/popups/' + sno + '/active', { method: 'PUT', body: { active: input.checked } })
              .then(function (result) {
                if (!result.ok || !result.json.success) throw new Error('fail');
                loadPopups();
              }).catch(function () {
                alert('변경에 실패했습니다.');
                input.checked = !input.checked;
                input.disabled = false;
              });
          });
        });

        document.getElementById('page-info').textContent =
          (pageData.totalElements === 0 ? 0 : currentPage + 1) + ' / ' + Math.max(pageData.totalPages, 1) + ' 페이지 (총 ' + pageData.totalElements + '건)';
        document.getElementById('prev-btn').disabled = currentPage <= 0;
        document.getElementById('next-btn').disabled = currentPage >= pageData.totalPages - 1;
      }).catch(function () {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">목록을 불러오지 못했습니다.</td></tr>';
      });
    }

    document.getElementById('prev-btn').addEventListener('click', function () {
      if (currentPage > 0) { currentPage--; loadPopups(); }
    });
    document.getElementById('next-btn').addEventListener('click', function () {
      currentPage++; loadPopups();
    });

    requireAdminSession(function () {
      renderAdminLayout('popups');
      document.getElementById('admin-content').hidden = false;
      loadPopups();
    });
  </script>
</body>
</html>
