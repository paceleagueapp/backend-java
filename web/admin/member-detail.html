<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 상세 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261102">
  <link rel="stylesheet" href="/css/admin.css?v=20261028">
  <style>
    .back-link { display: inline-block; margin-bottom: 16px; font-size: 13px; color: #8a8e96; }
    .detail-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; max-width: 480px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f1f3; font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #8a8e96; }
    .detail-value { color: #1c2024; font-weight: 600; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 700; }
    .badge-yes { background: #e6f4ea; color: #1c8a4a; }
    .badge-no { background: #fbeaea; color: #d02b22; }
    .badge-unset { background: #f2f3f5; color: #8a8e96; }
    .token-list { margin-top: 18px; }
    .token-list h2 { font-size: 15px; margin: 0 0 8px; }
    .token-item { border: 1px solid #f0f1f3; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
    .token-meta { color: #8a8e96; margin-bottom: 4px; }
    .token-id { font-family: monospace; font-size: 12px; word-break: break-all; color: #1c2024; }
    .token-empty { color: #8a8e96; font-size: 13px; }
    .coupon-card { margin-top: 20px; }
    .coupon-card h2 { font-size: 16px; margin: 0 0 12px; }
    .coupon-form { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid #f0f1f3; margin-bottom: 14px; }
    .coupon-form label { display: grid; gap: 4px; font-size: 13px; color: #4a4e56; }
    .coupon-form input[type=text], .coupon-form input[type=date] {
      padding: 9px 11px; border: 1px solid #d7dade; border-radius: 8px; font-size: 14px;
    }
    .coupon-preview { max-width: 160px; max-height: 160px; border-radius: 8px; border: 1px solid #e5e7eb; display: none; }
    .coupon-submit {
      background: #e5342f; color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer; justify-self: start;
    }
    .coupon-submit:disabled { opacity: 0.5; cursor: default; }
    .coupon-msg { font-size: 13px; }
    .coupon-msg.error { color: #d02b22; }
    .coupon-msg.ok { color: #1c8a4a; }
    .coupon-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f0f1f3; }
    .coupon-item:last-child { border-bottom: none; }
    .coupon-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid #e5e7eb; }
    .coupon-info { flex: 1; font-size: 13px; }
    .coupon-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .coupon-meta { color: #8a8e96; }
    .coupon-del { background: none; border: 1px solid #d7dade; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <a class="back-link" href="/admin/members">← 회원 목록으로</a>
      <h1>회원 상세</h1>
      <div class="detail-card" id="detail-card"></div>

      <div class="detail-card coupon-card" id="coupon-card" hidden>
        <h2>쿠폰</h2>
        <form class="coupon-form" id="coupon-form">
          <label>쿠폰명<input type="text" id="coupon-name" maxlength="100" placeholder="예: 스타벅스 아메리카노 T"></label>
          <label>사용기한 (이 날짜까지)<input type="date" id="coupon-expires"></label>
          <label>기프티콘 이미지 (JPEG/PNG/WEBP, 10MB 이하)<input type="file" id="coupon-image" accept="image/jpeg,image/png,image/webp"></label>
          <img class="coupon-preview" id="coupon-preview" alt="">
          <button class="coupon-submit" id="coupon-submit" type="submit">쿠폰 지급</button>
          <div class="coupon-msg" id="coupon-msg"></div>
        </form>
        <div id="coupon-list"></div>
      </div>
    </main>
  </div>

  <script src="/js/admin.js?v=20261028"></script>
  <script>
    function statusLabel(status) {
      return status === 'WITHDRAWN' ? '탈퇴' : '활성';
    }

    function pushBadge(detail) {
      if (!detail.pushNotificationAnswered) {
        return '<span class="badge badge-unset">응답 안 함</span>';
      }
      return detail.pushNotificationAgreed
        ? '<span class="badge badge-yes">동의함</span>'
        : '<span class="badge badge-no">동의 안 함</span>';
    }

    function formatDateTime(v) {
      return v ? String(v).replace('T', ' ').slice(0, 16) : '-';
    }

    function tokenSection(tokens) {
      tokens = tokens || [];
      var body = tokens.length === 0
        ? '<div class="token-empty">등록된 FCM 토큰이 없습니다. (이 회원에게는 푸시가 가지 않습니다)</div>'
        : tokens.map(function (t) {
            return '<div class="token-item">' +
              '<div class="token-meta">' + escapeHtmlAdmin(t.device) + ' · 마지막 등록 ' + formatDateTime(t.lastSeenAt) +
                ' · 최초 등록 ' + formatDateTime(t.createdAt) + '</div>' +
              '<div class="token-id">' + escapeHtmlAdmin(t.fcmId) + '</div>' +
            '</div>';
          }).join('');
      return '<div class="token-list"><h2>FCM 토큰 (' + tokens.length + ')</h2>' + body + '</div>';
    }

    function couponStatusText(c) {
      if (c.status === 'USED') return '사용완료 (' + formatDateTime(c.usedAt) + ')';
      return c.expired ? '기한만료' : '미사용';
    }

    function loadCoupons(sno) {
      var list = document.getElementById('coupon-list');
      adminApiFetch('/api/admin/coupons?memberSno=' + sno).then(function (result) {
        if (!result.ok || !result.json.success) {
          list.innerHTML = '<div class="token-empty">쿠폰 목록을 불러오지 못했습니다.</div>';
          return;
        }
        var coupons = result.json.data || [];
        if (coupons.length === 0) {
          list.innerHTML = '<div class="token-empty">지급한 쿠폰이 없습니다.</div>';
          return;
        }
        list.innerHTML = coupons.map(function (c) {
          var img = escapeHtmlAdmin(c.imageUrl);
          return '<div class="coupon-item">' +
            '<a href="' + img + '" target="_blank" rel="noopener"><img src="' + img + '" alt=""></a>' +
            '<div class="coupon-info">' +
              '<div class="coupon-name">' + escapeHtmlAdmin(c.name) + '</div>' +
              '<div class="coupon-meta">~' + escapeHtmlAdmin(c.expiresAt) + ' · ' + couponStatusText(c) +
                ' · 지급 ' + formatDateTime(c.createdAt) + '</div>' +
            '</div>' +
            '<button class="coupon-del" type="button" data-coupon-del="' + c.sno + '">삭제</button>' +
          '</div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('[data-coupon-del]'), function (btn) {
          btn.addEventListener('click', function () {
            if (!confirm('이 쿠폰을 삭제할까요? 회원 쿠폰함에서도 사라지고 이미지도 지워집니다.')) return;
            adminApiFetch('/api/admin/coupons/' + btn.getAttribute('data-coupon-del'), { method: 'DELETE' })
              .then(function (r) {
                if (!r.ok || !r.json.success) { alert((r.json && r.json.message) || '삭제하지 못했습니다.'); return; }
                loadCoupons(sno);
              });
          });
        });
      }).catch(function () {
        list.innerHTML = '<div class="token-empty">쿠폰 목록을 불러오지 못했습니다.</div>';
      });
    }

    function setCouponMsg(text, kind) {
      var el = document.getElementById('coupon-msg');
      el.textContent = text || '';
      el.className = 'coupon-msg' + (kind ? ' ' + kind : '');
    }

    function apiOrThrow(promise) {
      return promise.then(function (r) {
        if (!r.ok || !r.json.success) throw new Error((r.json && r.json.message) || '요청에 실패했습니다.');
        return r.json.data;
      });
    }

    // 이미지: 업로드 URL 발급 → S3 로 직접 PUT → imageKey 로 지급.
    function grantCoupon(sno) {
      var name = document.getElementById('coupon-name').value.trim();
      var expiresAt = document.getElementById('coupon-expires').value;
      var file = document.getElementById('coupon-image').files[0];
      if (!name || !expiresAt || !file) { setCouponMsg('쿠폰명, 사용기한, 이미지를 모두 입력하세요.', 'error'); return; }

      var btn = document.getElementById('coupon-submit');
      btn.disabled = true;
      setCouponMsg('업로드 중...');
      apiOrThrow(adminApiFetch('/api/admin/coupons/upload-url', {
        method: 'POST', body: { mimeType: file.type, fileSizeBytes: file.size }
      })).then(function (upload) {
        return fetch(upload.uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file })
          .then(function (res) {
            if (!res.ok) throw new Error('이미지 업로드에 실패했습니다.');
            return apiOrThrow(adminApiFetch('/api/admin/coupons', {
              method: 'POST', body: { memberSno: Number(sno), name: name, expiresAt: expiresAt, imageKey: upload.imageKey }
            }));
          });
      }).then(function () {
        setCouponMsg('지급했습니다.', 'ok');
        document.getElementById('coupon-form').reset();
        document.getElementById('coupon-preview').style.display = 'none';
        loadCoupons(sno);
      }).catch(function (e) {
        setCouponMsg(e.message, 'error');
      }).then(function () {
        btn.disabled = false;
      });
    }

    function initCoupons(sno, memberStatus) {
      document.getElementById('coupon-card').hidden = false;
      if (memberStatus === 'WITHDRAWN') {
        document.getElementById('coupon-form').hidden = true;
      }
      document.getElementById('coupon-image').addEventListener('change', function (e) {
        var file = e.target.files[0];
        var preview = document.getElementById('coupon-preview');
        if (!file) { preview.style.display = 'none'; return; }
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      });
      document.getElementById('coupon-form').addEventListener('submit', function (e) {
        e.preventDefault();
        grantCoupon(sno);
      });
      loadCoupons(sno);
    }

    function escapeHtmlAdmin(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function loadDetail(sno) {
      var card = document.getElementById('detail-card');
      card.innerHTML = '불러오는 중...';

      adminApiFetch('/api/admin/members/' + sno).then(function (result) {
        if (!result.ok || !result.json.success) {
          card.innerHTML = '회원 정보를 불러오지 못했습니다.';
          return;
        }
        var d = result.json.data;
        card.innerHTML =
          '<div class="detail-row"><span class="detail-label">회원번호</span><span class="detail-value">' + d.sno + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">아이디</span><span class="detail-value">' + escapeHtmlAdmin(d.memberId) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">닉네임</span><span class="detail-value">' + escapeHtmlAdmin(d.nickname || '-') + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">이메일</span><span class="detail-value">' + escapeHtmlAdmin(d.email || '-') + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">상태</span><span class="detail-value">' + statusLabel(d.status) + '</span></div>' +
          '<div class="detail-row"><span class="detail-label">가입일</span><span class="detail-value">' + String(d.createdAt || '').slice(0, 10) + '</span></div>' +
          (d.withdrawnAt ? '<div class="detail-row"><span class="detail-label">탈퇴일</span><span class="detail-value">' + String(d.withdrawnAt).slice(0, 10) + '</span></div>' : '') +
          '<div class="detail-row"><span class="detail-label">푸시 알림 동의</span><span class="detail-value">' + pushBadge(d) + '</span></div>' +
          tokenSection(d.deviceTokens);
        initCoupons(d.sno, d.status);
      }).catch(function () {
        card.innerHTML = '회원 정보를 불러오지 못했습니다.';
      });
    }

    requireAdminSession(function () {
      renderAdminLayout('members');
      document.getElementById('admin-content').hidden = false;

      var sno = new URLSearchParams(window.location.search).get('sno');
      if (!sno) {
        document.getElementById('detail-card').textContent = '잘못된 접근입니다.';
        return;
      }
      loadDetail(sno);
    });
  </script>
</body>
</html>
