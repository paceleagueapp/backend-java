<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림관리 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261102">
  <link rel="stylesheet" href="/css/admin.css?v=20261028">
  <style>
    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .page-head h1 { margin-bottom: 0 !important; }
    .new-btn { background: #e5342f; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .new-btn:hover { background: #c62828; }
    table.data-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; table-layout: fixed; }
    table.data-table th, table.data-table td { padding: 10px 14px; text-align: left; font-size: 13.5px; border-bottom: 1px solid #f0f1f3; }
    table.data-table th { background: #f7f8fa; color: #4a4e56; font-weight: 700; }
    table.data-table tbody tr.clickable { cursor: pointer; }
    table.data-table tbody tr.clickable:hover { background: #fafbfc; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview { color: #6b7078; }
    .sent { font-size: 12.5px; color: #8a8e96; }
    .empty-row td { text-align: center; color: #8a8e96; padding: 30px; }
    .pagination { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .pagination button { background: #fff; border: 1px solid #d7dade; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination span { font-size: 13px; color: #4a4e56; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <div class="page-head">
        <h1>알림관리</h1>
        <a class="new-btn" href="/admin/notification-edit">+ 알림 등록</a>
      </div>

      <table class="data-table">
        <colgroup>
          <col style="width:70px"><col style="width:22%"><col><col style="width:20%"><col style="width:150px">
        </colgroup>
        <thead>
          <tr><th>번호</th><th>제목</th><th>내용</th><th>대상자</th><th>알림 생성일</th></tr>
        </thead>
        <tbody id="notification-tbody"></tbody>
      </table>

      <div class="pagination">
        <button id="prev-btn">이전</button>
        <span id="page-info"></span>
        <button id="next-btn">다음</button>
      </div>
    </main>
  </div>

  <script src="/js/admin.js?v=20261109"></script>
  <script>
    var currentPage = 0;
    var PAGE_SIZE = 20;

    function escapeHtmlAdmin(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDateTime(iso) {
      if (!iso) return '-';
      return String(iso).slice(0, 16).replace('T', ' ');
    }

    // "홍길동, 김철수 외 3명" + 발송 수
    function targetHtml(n) {
      var names = (n.targetNicknames || []).join(', ');
      var rest = n.targetCount - (n.targetNicknames || []).length;
      var label = names + (rest > 0 ? ' 외 ' + rest + '명' : '');
      return '<div class="ellipsis" title="' + escapeHtmlAdmin(label) + '">' + escapeHtmlAdmin(label) + '</div>' +
        '<div class="sent">발송 ' + n.sentCount + ' / ' + n.targetCount + '명</div>';
    }

    function loadNotifications() {
      var tbody = document.getElementById('notification-tbody');
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>';

      adminApiFetch('/api/admin/notifications?page=' + currentPage + '&size=' + PAGE_SIZE).then(function (result) {
        if (!result.ok || !result.json.success) {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="5">목록을 불러오지 못했습니다.</td></tr>';
          return;
        }
        var pageData = result.json.data;
        var rows = pageData.content || [];

        tbody.innerHTML = rows.length === 0
          ? '<tr class="empty-row"><td colspan="5">등록된 알림이 없습니다.</td></tr>'
          : rows.map(function (n) {
              return '<tr class="clickable" data-sno="' + n.sno + '">' +
                '<td>' + n.sno + '</td>' +
                '<td class="ellipsis">' + escapeHtmlAdmin(n.title) + '</td>' +
                '<td class="ellipsis preview">' + escapeHtmlAdmin(n.contentPreview) + '</td>' +
                '<td>' + targetHtml(n) + '</td>' +
                '<td>' + formatDateTime(n.createdAt) + '</td>' +
              '</tr>';
            }).join('');

        Array.prototype.forEach.call(tbody.querySelectorAll('tr.clickable'), function (tr) {
          tr.addEventListener('click', function () {
            window.location.href = '/admin/notification-detail?sno=' + tr.getAttribute('data-sno');
          });
        });

        document.getElementById('page-info').textContent =
          (pageData.totalElements === 0 ? 0 : currentPage + 1) + ' / ' + Math.max(pageData.totalPages, 1) + ' 페이지 (총 ' + pageData.totalElements + '건)';
        document.getElementById('prev-btn').disabled = currentPage <= 0;
        document.getElementById('next-btn').disabled = currentPage >= pageData.totalPages - 1;
      }).catch(function () {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">목록을 불러오지 못했습니다.</td></tr>';
      });
    }

    document.getElementById('prev-btn').addEventListener('click', function () {
      if (currentPage > 0) { currentPage--; loadNotifications(); }
    });
    document.getElementById('next-btn').addEventListener('click', function () {
      currentPage++; loadNotifications();
    });

    requireAdminSession(function () {
      renderAdminLayout('notifications');
      document.getElementById('admin-content').hidden = false;
      loadNotifications();
    });
  </script>
</body>
</html>
