<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팝업 등록 - Pace League Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261028">
  <link rel="stylesheet" href="/css/admin.css?v=20261028">
  <style>
    .form-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 22px; max-width: 640px; }
    .form-card label.field-label { display: block; font-size: 12.5px; color: #8a8e96; margin: 14px 0 6px; font-weight: 600; }
    .form-card label.field-label:first-child { margin-top: 0; }
    .form-card input[type="text"], .form-card input[type="datetime-local"] {
      width: 100%; padding: 9px 10px; border: 1px solid #d7dade; border-radius: 8px; font-size: 14px; background: #fff; color: #1c2024;
    }
    .form-card input:focus, .form-card .editor-content:focus { outline: none; border-color: #e5342f; }

    /* 게시판 글쓰기 다이얼로그(index.html)의 에디터 스타일 그대로 */
    .editor-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .editor-toolbar button {
      background: #f4f5f7; border: 1px solid #d7dade; color: #4a4e56; width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer; font-size: 14px; padding: 0;
    }
    .editor-toolbar button:hover { background: #e9ebee; }
    .editor-content {
      width: 100%; min-height: 160px; max-height: 420px; overflow-y: auto;
      background: #fff; border: 1px solid #d7dade; color: #1c2024; padding: 10px; border-radius: 8px;
      font-size: 14px; line-height: 1.5;
    }
    .editor-content.is-empty:before { content: attr(data-placeholder); color: #9aa0a8; }
    .editor-content img, .editor-content video { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
    .editor-content a { color: #2f6fd6; }
    .media-placeholder { display: inline-block; background: #eef0f3; color: #4a52c4; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
    .media-placeholder.rejected { color: #c0392b; }

    .radio-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: #1c2024; }
    .radio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .period-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .period-row input { flex: 1; min-width: 200px; }
    .period-row span { color: #8a8e96; }
    .hint { font-size: 12px; color: #9aa0a8; margin-top: 6px; }
    .active-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1c2024; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cfd3d8; border-radius: 22px; cursor: pointer; transition: .15s; }
    .switch .slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch input:checked + .slider { background: #e5342f; }
    .switch input:checked + .slider:before { transform: translateX(18px); }

    .actions { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
    .actions button, .actions a { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; text-decoration: none; }
    .actions .submit { background: #e5342f; color: #fff; }
    .actions .submit:hover { background: #c62828; }
    .actions .secondary { background: #eceef1; color: #4a4e56; }
    .actions .danger { background: #fff; color: #d02b22; border: 1px solid #f1c4c1; margin-left: auto; }
    .form-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .form-msg.err { color: #d02b22; }
    .form-msg.ok { color: #1c8a4a; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="admin-content" id="admin-content" hidden>
      <h1 id="page-title">팝업 등록</h1>

      <div class="form-card">
        <label class="field-label" for="popup-title">제목</label>
        <input type="text" id="popup-title" maxlength="200" placeholder="팝업 제목">

        <label class="field-label">내용</label>
        <div class="editor-toolbar">
          <button type="button" id="fmt-bold" title="굵게"><b>B</b></button>
          <button type="button" id="fmt-italic" title="기울임"><i>I</i></button>
          <button type="button" id="fmt-link" title="링크">🔗</button>
          <button type="button" id="fmt-image" title="이미지">🖼️</button>
          <button type="button" id="fmt-video" title="동영상">🎬</button>
        </div>
        <div id="popup-content" class="editor-content is-empty" contenteditable="true" data-placeholder="팝업 내용을 입력하세요"></div>
        <input type="file" id="popup-media-file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime" style="display:none">

        <label class="field-label">노출 대상</label>
        <div class="radio-row">
          <label><input type="radio" name="target" value="WEB"> 웹</label>
          <label><input type="radio" name="target" value="APP"> 앱</label>
          <label><input type="radio" name="target" value="BOTH" checked> 웹 + 앱</label>
        </div>

        <label class="field-label">노출 기간 (한국시간)</label>
        <div class="period-row">
          <input type="datetime-local" id="popup-start">
          <span>~</span>
          <input type="datetime-local" id="popup-end">
        </div>
        <div class="hint">시작 시각부터 종료 시각 직전까지 노출됩니다.</div>

        <label class="field-label">활성화</label>
        <div class="active-row">
          <label class="switch"><input type="checkbox" id="popup-active" checked><span class="slider"></span></label>
          <span id="active-label">활성</span>
        </div>

        <div class="form-msg" id="form-msg"></div>
        <div class="actions">
          <button type="button" class="submit" id="save-btn">저장</button>
          <button type="button" class="secondary" id="preview-btn">미리보기</button>
          <a class="secondary" href="/admin/popups">목록</a>
          <button type="button" class="danger" id="delete-btn" hidden>삭제</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/admin.js?v=20261028"></script>
  <!-- 게시판 글쓰기와 같은 에디터(createPostEditor)와 팝업 미리보기(showNextSitePopup)를 그대로 쓰려고 공용 스크립트를 함께 로드 -->
  <script src="/js/app.js?v=20261028"></script>
  <script src="/js/i18n.js?v=20261028"></script>
  <script>
    var popupSno = new URLSearchParams(location.search).get('sno');

    var editor = createPostEditor({
      editorEl: document.getElementById('popup-content'),
      fileInputEl: document.getElementById('popup-media-file'),
      boldBtn: document.getElementById('fmt-bold'),
      italicBtn: document.getElementById('fmt-italic'),
      linkBtn: document.getElementById('fmt-link'),
      imageBtn: document.getElementById('fmt-image'),
      videoBtn: document.getElementById('fmt-video'),
      // 회원 JWT 가 아니라 관리자 세션으로 업로드
      fetchJson: function (path, options) {
        return adminApiFetch(path, options).then(function (result) { return result.json; });
      },
      mediaBasePath: '/api/admin/media'
    });

    function showMsg(text, ok) {
      var el = document.getElementById('form-msg');
      el.className = 'form-msg ' + (ok ? 'ok' : 'err');
      el.textContent = text;
    }

    function selectedTarget() {
      var checked = document.querySelector('input[name="target"]:checked');
      return checked ? checked.value : null;
    }

    function syncActiveLabel() {
      document.getElementById('active-label').textContent =
        document.getElementById('popup-active').checked ? '활성' : '비활성';
    }
    document.getElementById('popup-active').addEventListener('change', syncActiveLabel);

    // 서버 LocalDateTime("2026-11-01T09:00:00") → datetime-local 값("2026-11-01T09:00")
    function toInputValue(iso) {
      return iso ? String(iso).slice(0, 16) : '';
    }

    function fillForm(p) {
      document.getElementById('popup-title').value = p.title || '';
      editor.reset(p.content || '');
      var radio = document.querySelector('input[name="target"][value="' + p.target + '"]');
      if (radio) radio.checked = true;
      document.getElementById('popup-start').value = toInputValue(p.startAt);
      document.getElementById('popup-end').value = toInputValue(p.endAt);
      document.getElementById('popup-active').checked = !!p.active;
      syncActiveLabel();
    }

    function loadPopup() {
      adminApiFetch('/api/admin/popups/' + encodeURIComponent(popupSno)).then(function (result) {
        if (!result.ok || !result.json.success) {
          showMsg((result.json && result.json.message) || '팝업을 불러오지 못했습니다.', false);
          return;
        }
        fillForm(result.json.data);
      });
    }

    document.getElementById('save-btn').addEventListener('click', function () {
      var title = document.getElementById('popup-title').value.trim();
      var startAt = document.getElementById('popup-start').value;
      var endAt = document.getElementById('popup-end').value;

      if (!title || editor.isBlank()) { showMsg('제목과 내용을 입력해주세요.', false); return; }
      if (editor.hasPending()) { showMsg('이미지/동영상 업로드가 끝난 뒤 저장해주세요.', false); return; }
      if (!startAt || !endAt) { showMsg('노출 기간을 입력해주세요.', false); return; }
      if (endAt <= startAt) { showMsg('종료 시각은 시작 시각보다 뒤여야 합니다.', false); return; }

      var body = {
        title: title,
        content: editor.getContentHtml(),
        target: selectedTarget(),
        startAt: startAt,
        endAt: endAt,
        active: document.getElementById('popup-active').checked
      };
      var saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      adminApiFetch(popupSno ? '/api/admin/popups/' + encodeURIComponent(popupSno) : '/api/admin/popups', {
        method: popupSno ? 'PUT' : 'POST',
        body: body
      }).then(function (result) {
        if (!result.ok || !result.json.success) {
          throw new Error((result.json && result.json.message) || '저장에 실패했습니다.');
        }
        editor.clearPollTimers();
        window.location.href = '/admin/popups';
      }).catch(function (err) {
        saveBtn.disabled = false;
        showMsg((err && err.message) || '저장에 실패했습니다.', false);
      });
    });

    // 실제 홈 화면에 뜨는 팝업(app.js showNextSitePopup)과 같은 모양으로 미리 본다.
    document.getElementById('preview-btn').addEventListener('click', function () {
      showNextSitePopup([{
        sno: 'preview',
        title: document.getElementById('popup-title').value.trim() || '(제목 없음)',
        content: editor.getContentHtml()
      }]);
    });

    document.getElementById('delete-btn').addEventListener('click', function () {
      if (!confirm('이 팝업을 삭제할까요? 되돌릴 수 없습니다.')) return;
      adminApiFetch('/api/admin/popups/' + encodeURIComponent(popupSno), { method: 'DELETE' }).then(function (result) {
        if (!result.ok || !result.json.success) {
          throw new Error((result.json && result.json.message) || '삭제에 실패했습니다.');
        }
        window.location.href = '/admin/popups';
      }).catch(function (err) {
        showMsg((err && err.message) || '삭제에 실패했습니다.', false);
      });
    });

    requireAdminSession(function () {
      renderAdminLayout('popups');
      document.getElementById('admin-content').hidden = false;
      if (popupSno) {
        document.getElementById('page-title').textContent = '팝업 수정';
        document.title = '팝업 수정 - Pace League Admin';
        document.getElementById('delete-btn').hidden = false;
        loadPopup();
      }
    });
  </script>
</body>
</html>
