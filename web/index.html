<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pace League</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p { color: #888; font-size: 15px; margin-bottom: 32px; }
    a {
      background: #e53935;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
    }
    a:hover { background: #c62828; }
    footer { position: absolute; bottom: 24px; color: #444; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Pace League</h1>
  <p>러닝 기록 & 랭킹 앱</p>
  <a href="https://play.google.com/store/apps/details?id=com.paceleague.app" target="_blank">
    Google Play에서 다운로드
  </a>
  <footer>© 2026 Pace League. All rights reserved.</footer>
</body>
</html>
