<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pace League</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
    }
    .page { max-width: 900px; margin: 0 auto; padding: 20px; display: flex; align-items: flex-start; gap: 24px; }
    .main-col { flex: 1; min-width: 0; max-width: 640px; }
    .side-col { width: 220px; flex-shrink: 0; position: sticky; top: 20px; }
    @media (max-width: 760px) {
      .page { flex-direction: column; }
      .main-col { max-width: 100%; }
      .side-col { width: 100%; position: static; }
    }

    .top10-widget { background: #1a1a1a; border: 1px solid #262626; border-radius: 10px; padding: 14px; }
    .top10-widget h2 { font-size: 13px; font-weight: 700; color: #ccc; text-align: center; margin-bottom: 10px; }
    .top10-list { list-style: none; }
    .top10-list li {
      display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px;
      border-bottom: 1px solid #262626;
    }
    .top10-list li:last-child { border-bottom: none; }
    .top10-rank { color: #e53935; font-weight: 700; width: 16px; flex-shrink: 0; }
    .top10-nickname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top10-tier { color: #888; font-size: 10px; flex-shrink: 0; }
    .top10-score { color: #fff; font-weight: 600; flex-shrink: 0; }
    .top10-loading, .top10-empty { text-align: center; color: #666; padding: 10px; font-size: 12px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 20px; font-weight: 700; }
    .btn {
      background: #e53935; color: #fff; text-decoration: none; border: none;
      padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #c62828; }
    .btn.ghost { background: none; color: #ccc; border: 1px solid #333; padding: 7px 16px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #lang-select {
      background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 16px;
      padding: 6px 10px; font-size: 13px; cursor: pointer;
    }
    footer { text-align: center; color: #444; font-size: 13px; padding: 30px 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { background: #1a1a1a; color: #ccc; padding: 8px 14px; border-radius: 16px; font-size: 13px; text-decoration: none; }
    .tab.active { background: #e53935; color: #fff; }

    .sort-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sort-buttons button { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; margin-right: 10px; }
    .sort-buttons button.active { color: #fff; font-weight: 700; }

    .post-list { list-style: none; }
    .post-list li { background: #1a1a1a; border-radius: 10px; padding: 14px; margin-bottom: 8px; }
    .post-item-row { display: flex; gap: 10px; }
    .post-item-body { flex: 1; min-width: 0; }
    .post-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #0f0f0f; cursor: pointer; }
    .post-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .post-title { font-size: 15px; font-weight: 600; cursor: pointer; }
    .post-translate-link { color: #888; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; padding-top: 2px; }
    .post-meta { font-size: 12px; color: #888; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .author-tier { background: #262626; color: #ccc; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
    .record-badge { font-size: 12px; }
    .empty { text-align: center; color: #666; padding: 30px; }

    .pager { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
    .pager button { background: none; border: 1px solid #333; color: #ccc; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
    .pager button:disabled { opacity: 0.3; cursor: default; }

    dialog#write-dialog { background: #1a1a1a; color: #fff; border: none; border-radius: 12px; padding: 20px; width: 90%; max-width: 480px; }
    dialog#write-dialog input {
      width: 100%; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px;
    }
    dialog#write-dialog label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    dialog#write-dialog select { width: 100%; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    dialog#write-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
    dialog#write-dialog button.submit { background: #e53935; color: #fff; }
    dialog#write-dialog button.cancel { background: #333; color: #ccc; border: none; }
    dialog#write-dialog button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }

    .editor-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .editor-toolbar button {
      background: #0f0f0f; border: 1px solid #333; color: #ccc; width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer; font-size: 14px; padding: 0;
    }
    .editor-toolbar button:hover { background: #262626; }
    .editor-content {
      width: 100%; min-height: 120px; max-height: 320px; overflow-y: auto;
      background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    }
    .editor-content.is-empty:before { content: attr(data-placeholder); color: #666; }
    .editor-content img, .editor-content video { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
    .editor-content a { color: #64b5f6; }
    .media-placeholder { display: inline-block; background: #262626; color: #9aa5e8; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
    .media-placeholder.rejected { color: #ff8a80; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18338881972"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18338881972');
  </script>
</head>
<body>
  <div class="page">
    <div class="main-col">
      <header>
        <h1>Pace League</h1>
        <div class="header-actions" id="header-actions"></div>
      </header>

      <div id="content"></div>
    </div>

    <div class="side-col">
      <div class="top10-widget">
        <h2 id="top10-heading">TOP 10</h2>
        <ol class="top10-list" id="top10-list"><li class="top10-loading">...</li></ol>
      </div>
    </div>
  </div>

  <dialog id="write-dialog">
    <input type="text" id="write-title" maxlength="200">
    <div class="editor-toolbar" id="editor-toolbar">
      <button type="button" id="fmt-bold"><b>B</b></button>
      <button type="button" id="fmt-italic"><i>I</i></button>
      <button type="button" id="fmt-link">🔗</button>
      <button type="button" id="fmt-image">🖼️</button>
      <button type="button" id="fmt-video">🎬</button>
    </div>
    <div id="write-content" class="editor-content is-empty" contenteditable="true"></div>
    <input type="file" id="write-media-file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime" style="display:none">
    <label id="write-record-label" for="write-record"></label>
    <select id="write-record"></select>
    <div class="error" id="write-error" style="color:#ff6b6b;font-size:13px;margin-bottom:8px;"></div>
    <div class="actions">
      <button class="cancel" id="write-cancel"></button>
      <button class="submit" id="write-submit"></button>
    </div>
  </dialog>

  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    var postEditor = createPostEditor({
      editorEl: document.getElementById('write-content'),
      fileInputEl: document.getElementById('write-media-file'),
      boldBtn: document.getElementById('fmt-bold'),
      italicBtn: document.getElementById('fmt-italic'),
      linkBtn: document.getElementById('fmt-link'),
      imageBtn: document.getElementById('fmt-image'),
      videoBtn: document.getElementById('fmt-video')
    });

    renderHeader();
    renderFeed();
    renderTop10();

    function renderTop10() {
      document.getElementById('top10-heading').textContent = t('top10Heading');

      fetch('https://api.paceleague.co.kr/api/ranking/top10?lang=' + encodeURIComponent(getLang()))
        .then(function (res) { return res.json(); })
        .then(function (json) {
          var listEl = document.getElementById('top10-list');
          var items = (json && json.data) || [];

          if (items.length === 0) {
            listEl.innerHTML = '<li class="top10-empty">' + t('top10Empty') + '</li>';
            return;
          }

          listEl.innerHTML = items.map(function (item) {
            return '<li>' +
              '<span class="top10-rank">' + item.rank + '</span>' +
              '<span class="top10-nickname">' + escapeHtml(item.nickname || '-') + '</span>' +
              '<span class="top10-tier">' + escapeHtml(item.tierLabel || item.tier) + '</span>' +
              '<span class="top10-score">' + item.totalScore + '</span>' +
              '</li>';
          }).join('');
        })
        .catch(function () {
          document.getElementById('top10-list').innerHTML = '<li class="top10-empty">' + t('top10LoadFailed') + '</li>';
        });
    }

    function renderHeader() {
      var actionsEl = document.getElementById('header-actions');
      var langSelectHtml = '<select id="lang-select"></select>';
      if (isLoggedIn()) {
        actionsEl.innerHTML =
          '<button class="btn" id="write-btn">' + t('write') + '</button>' +
          '<a class="btn ghost" href="#" id="logout-link">' + t('logout') + '</a>' +
          langSelectHtml;
        document.getElementById('logout-link').addEventListener('click', function (e) {
          e.preventDefault();
          logout();
        });
      } else {
        actionsEl.innerHTML =
          '<button class="btn" id="write-btn">' + t('write') + '</button>' +
          '<a class="btn ghost" href="/login.html">' + t('login') + '</a>' +
          langSelectHtml;
      }
      renderLangSelect(document.getElementById('lang-select'));

      document.getElementById('write-title').placeholder = t('titlePlaceholder');
      document.getElementById('write-content').setAttribute('data-placeholder', t('contentPlaceholder'));
      document.getElementById('write-record-label').textContent = t('attachRecordLabel');
      document.getElementById('write-cancel').textContent = t('cancel');
      document.getElementById('write-submit').textContent = t('submit');

      document.getElementById('fmt-bold').title = t('editorBoldTitle');
      document.getElementById('fmt-italic').title = t('editorItalicTitle');
      document.getElementById('fmt-link').title = t('editorLinkTitle');
      document.getElementById('fmt-image').title = t('editorImageTitle');
      document.getElementById('fmt-video').title = t('editorVideoTitle');

      // 비로그인 상태에서 글쓰기를 누르면 로그인 페이지로 보낸다(작성/댓글/추천만 로그인 필요).
      document.getElementById('write-btn').addEventListener('click', function () {
        if (redirectToLoginIfNeeded()) return;
        document.getElementById('write-title').value = '';
        postEditor.reset();
        document.getElementById('write-error').textContent = '';
        loadRecordOptions(document.getElementById('write-record'));
        document.getElementById('write-dialog').showModal();
      });
    }

    function renderFeed() {
      document.getElementById('content').innerHTML =
        '<div class="tabs" id="tabs"></div>' +
        '<div class="sort-row">' +
          '<div class="sort-buttons">' +
            '<button id="sort-new" class="active">' + t('sortNew') + '</button>' +
            '<button id="sort-top">' + t('sortTop') + '</button>' +
          '</div>' +
        '</div>' +
        '<ol class="post-list" id="post-list"></ol>' +
        '<div class="pager" id="pager"></div>';

      var boards = [];
      var currentBoardSno = null;
      var currentPage = 0;
      var currentSort = 'new';

      function boardSlugFromQuery() {
        return new URLSearchParams(window.location.search).get('board');
      }

      function renderTabs() {
        document.getElementById('tabs').innerHTML = boards.map(function (b) {
          var active = b.sno === currentBoardSno ? ' active' : '';
          return '<a class="tab' + active + '" href="/index.html?board=' + encodeURIComponent(b.slug) + '">' +
            escapeHtml(b.name) + '</a>';
        }).join('');
      }

      var titleBySno = {};
      var translatedTitleBySno = {};
      var showingTitleTranslation = {};

      function renderPosts(pageData) {
        var listEl = document.getElementById('post-list');
        var items = pageData.content || [];

        titleBySno = {};
        translatedTitleBySno = {};
        showingTitleTranslation = {};

        if (items.length === 0) {
          listEl.innerHTML = '<div class="empty">' + t('noPosts') + '</div>';
        } else {
          listEl.innerHTML = items.map(function (p) {
            titleBySno[p.sno] = p.title;
            var thumbHtml = '';
            if (p.thumbnailUrl) {
              thumbHtml = p.thumbnailType === 'VIDEO'
                ? '<video class="post-thumb post-open" data-sno="' + p.sno + '" src="' + escapeHtml(p.thumbnailUrl) + '" preload="metadata" muted></video>'
                : '<img class="post-thumb post-open" data-sno="' + p.sno + '" src="' + escapeHtml(p.thumbnailUrl) + '" loading="lazy" alt="">';
            }
            return '<li>' +
              '<div class="post-item-row">' +
                thumbHtml +
                '<div class="post-item-body">' +
                  '<div class="post-title-row">' +
                    '<div class="post-title post-open" data-sno="' + p.sno + '" id="post-title-' + p.sno + '">' + escapeHtml(p.title) + '</div>' +
                    '<span class="post-translate-link" data-sno="' + p.sno + '">' + t('translateShow') + '</span>' +
                  '</div>' +
                  '<div class="post-meta">' +
                    '<span>' + escapeHtml(p.nickname) + '</span>' +
                    '<span class="author-tier">' + escapeHtml(p.authorTierLabel || p.authorTier) + '</span>' +
                    (p.recordSno ? '<span class="record-badge" title="' + escapeHtml(t('attachedRecordHeading')) + '">🏃</span>' : '') +
                    '<span>' + t('reactionLabel') + ' ' + p.score + '</span>' +
                    '<span>' + t('commentCountLabel') + ' ' + p.commentCount + '</span>' +
                    '<span>' + t('viewCountLabel') + ' ' + p.viewCount + '</span>' +
                    '<span>' + escapeHtml(formatLocalTime(p.createAt)) + '</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</li>';
          }).join('');

          listEl.querySelectorAll('.post-open').forEach(function (el) {
            el.addEventListener('click', function () {
              location.href = '/post.html?post=' + el.getAttribute('data-sno');
            });
          });
          listEl.querySelectorAll('.post-translate-link').forEach(function (el) {
            el.addEventListener('click', function (e) {
              e.stopPropagation();
              toggleTitleTranslation(el.getAttribute('data-sno'), el);
            });
          });
        }

        var pagerEl = document.getElementById('pager');
        pagerEl.innerHTML =
          '<button id="prev-page"' + (pageData.first ? ' disabled' : '') + '>' + t('prevPage') + '</button>' +
          '<button id="next-page"' + (pageData.last ? ' disabled' : '') + '>' + t('nextPage') + '</button>';
        document.getElementById('prev-page').addEventListener('click', function () {
          if (!pageData.first) { currentPage--; loadPosts(); }
        });
        document.getElementById('next-page').addEventListener('click', function () {
          if (!pageData.last) { currentPage++; loadPosts(); }
        });
      }

      function loadPosts() {
        apiFetch('/api/board/' + currentBoardSno + '/posts?page=' + currentPage + '&size=20&sort=' + currentSort + '&lang=' + encodeURIComponent(getLang()))
          .then(function (json) { renderPosts(json.data); });
      }

      function toggleTitleTranslation(sno, linkEl) {
        if (redirectToLoginIfNeeded()) return;
        var titleEl = document.getElementById('post-title-' + sno);

        if (showingTitleTranslation[sno]) {
          titleEl.textContent = titleBySno[sno];
          showingTitleTranslation[sno] = false;
          linkEl.textContent = t('translateShow');
          return;
        }

        if (translatedTitleBySno[sno]) {
          titleEl.textContent = translatedTitleBySno[sno];
          showingTitleTranslation[sno] = true;
          linkEl.textContent = t('translateHide');
          return;
        }

        apiFetch('/api/board/posts/' + sno + '/translate', {
          method: 'POST',
          body: { targetLanguage: getLang() }
        }).then(function (json) {
          if (!json.success) {
            alert(t('translateFailed'));
            return;
          }
          translatedTitleBySno[sno] = json.data.title;
          titleEl.textContent = json.data.title;
          showingTitleTranslation[sno] = true;
          linkEl.textContent = t('translateHide');
        });
      }

      function selectSort(sort) {
        currentSort = sort;
        currentPage = 0;
        document.getElementById('sort-new').classList.toggle('active', sort === 'new');
        document.getElementById('sort-top').classList.toggle('active', sort === 'top');
        loadPosts();
      }

      document.getElementById('sort-new').addEventListener('click', function () { selectSort('new'); });
      document.getElementById('sort-top').addEventListener('click', function () { selectSort('top'); });

      document.getElementById('write-submit').addEventListener('click', function () {
        var title = document.getElementById('write-title').value.trim();
        var content = postEditor.getContentHtml();
        var errorEl = document.getElementById('write-error');

        if (!title || postEditor.isBlank()) {
          errorEl.textContent = t('writeErrorEmpty');
          return;
        }
        if (postEditor.hasPending()) {
          errorEl.textContent = t('attachMediaPendingBlockSubmit');
          return;
        }

        var recordSnoValue = document.getElementById('write-record').value;

        apiFetch('/api/board/' + currentBoardSno + '/posts', {
          method: 'POST',
          body: {
            title: title, content: content,
            recordSno: recordSnoValue ? Number(recordSnoValue) : null
          }
        }).then(function (json) {
          if (!json.success) {
            errorEl.textContent = json.message || t('writeFailed');
            return;
          }
          postEditor.clearPollTimers();
          window.location.href = '/post.html?post=' + json.data.sno;
        });
      });
      document.getElementById('write-cancel').addEventListener('click', function () {
        document.getElementById('write-dialog').close();
      });

      apiFetch('/api/board?lang=' + encodeURIComponent(getLang())).then(function (json) {
        boards = json.data || [];
        var slug = boardSlugFromQuery();
        var selected = boards.find(function (b) { return b.slug === slug; }) || boards[0];
        if (!selected) {
          document.getElementById('post-list').innerHTML = '<div class="empty">' + t('noBoards') + '</div>';
          return;
        }
        currentBoardSno = selected.sno;
        renderTabs();
        loadPosts();
      });
    }
  </script>
</body>
</html>
