  <style>
    /* 공용 스타일은 /css/app.css. 아래는 커뮤니티 홈 전용. */
    .post-vote-num, .top10-score { font-variant-numeric: tabular-nums; }

    /* ── 본문 2단 (피드 + 우측 랭킹) ── */
    .page { display: flex; align-items: flex-start; gap: 24px; }
    .main-col { flex: 1; min-width: 0; }
    .side-col { width: 300px; flex-shrink: 0; position: sticky; top: 72px; display: flex; flex-direction: column; gap: 14px; }

    .rail-card { background: #fff; border: 1px solid #eceef1; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(22,24,28,0.05); }
    .rail-title { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #1c2024; }
    .rail-title svg { color: #e5342f; flex-shrink: 0; }
    .rank-list { list-style: none; }
    .rank-list li { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid #f2f3f5; }
    .rank-list li:last-child { border-bottom: none; }
    .top10-crew { width: 14px; height: 14px; border-radius: 3px; object-fit: cover; flex-shrink: 0; }
    .top10-nickname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top10-tier { color: #9aa0a8; font-size: 10px; flex-shrink: 0; }
    .top10-score { font-weight: 700; flex-shrink: 0; }
    .top10-loading, .top10-empty { text-align: center; color: #9aa0a8; padding: 10px; font-size: 12px; }

    /* ── 피드 툴바 (탭 + 정렬) ── */
    .feed-toolbar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: #fff; border: 1px solid #eceef1; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(20,22,26,0.05);
    }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
    .tab { font-size: 12px; font-weight: 600; color: #5b616a; text-decoration: none; border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
    .tab:hover { background: #f2f3f5; }
    .tab.active { color: #fff; background: #e5342f; font-weight: 700; }
    .sort-buttons { display: flex; gap: 10px; flex-shrink: 0; }
    .sort-buttons button { background: none; border: none; color: #9aa0a8; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 2px; }
    .sort-buttons button.active { color: #1c2024; font-weight: 700; }

    /* ── 글 카드 (좌측 추천수 컬럼 + 본문) ── */
    .post-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .post-card { display: flex; background: #fff; border: 1px solid #eceef1; border-radius: 12px; box-shadow: 0 1px 2px rgba(20,22,26,0.05); overflow: hidden; }
    .post-vote {
      width: 52px; flex-shrink: 0; background: #fafafb; border-right: 1px solid #f0f1f3;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #e5342f;
    }
    .post-vote-num { font-size: 13px; font-weight: 700; color: #3b4048; }
    .post-body { flex: 1; min-width: 0; padding: 14px 15px; }
    .post-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .post-title { font-size: 15px; font-weight: 700; line-height: 1.4; color: #1c2024; cursor: pointer; }
    .post-title:hover { color: #e5342f; }
    .post-translate-link { color: #9aa0a8; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; padding-top: 3px; }
    .post-row { display: flex; gap: 12px; align-items: flex-start; }
    .post-col { flex: 1; min-width: 0; }
    .post-snippet {
      font-size: 12.5px; color: #5b616a; line-height: 1.5; margin-bottom: 9px; cursor: pointer;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .post-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px; color: #868c95; }
    .post-meta svg { display: block; }
    .post-author { font-weight: 600; color: #3b4048; }
    .record-badge { display: inline-flex; align-items: center; color: #e5342f; }
    .post-thumb { width: 100px; height: 100px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #f0f1f3; cursor: pointer; }
    .post-thumb img, .post-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .empty { text-align: center; color: #9aa0a8; padding: 40px 20px; background: #fff; border: 1px solid #eceef1; border-radius: 12px; }
    .pager { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
    .pager button { background: #fff; border: 1px solid #e3e5e9; color: #4a4e56; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .pager button:disabled { opacity: 0.4; cursor: default; }

    @media (max-width: 760px) {
      .page { flex-direction: column; padding: 14px 14px 62px; gap: 14px; }
      .main-col { max-width: 100%; }
      .side-col { position: static; width: 100%; top: auto; }
      .post-thumb { width: 68px; height: 68px; }
      .post-title { font-size: 14px; }
    }

    /* ── 글쓰기 다이얼로그 (라이트 테마) ── */
    dialog#write-dialog { background: #fff; color: #1c2024; border: 1px solid #e3e5e9; border-radius: 14px; padding: 20px; width: 92%; max-width: 480px; }
    dialog#write-dialog::backdrop { background: rgba(20,22,26,0.45); }
    dialog#write-dialog input {
      width: 100%; background: #fff; border: 1px solid #d7dade; color: #1c2024; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px;
    }
    dialog#write-dialog input:focus, dialog#write-dialog select:focus, dialog#write-dialog .editor-content:focus { outline: none; border-color: #e5342f; }
    dialog#write-dialog label { display: block; font-size: 12px; color: #868c95; margin-bottom: 6px; }
    dialog#write-dialog select { width: 100%; background: #fff; border: 1px solid #d7dade; color: #1c2024; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    dialog#write-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
    dialog#write-dialog button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    dialog#write-dialog button.submit { background: #e5342f; color: #fff; }
    dialog#write-dialog button.cancel { background: #eceef1; color: #4a4e56; }

    .editor-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .editor-toolbar button {
      background: #f4f5f7; border: 1px solid #d7dade; color: #4a4e56; width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer; font-size: 14px; padding: 0;
    }
    .editor-toolbar button:hover { background: #e9ebee; }
    .editor-content {
      width: 100%; min-height: 120px; max-height: 320px; overflow-y: auto;
      background: #fff; border: 1px solid #d7dade; color: #1c2024; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    }
    .editor-content.is-empty:before { content: attr(data-placeholder); color: #9aa0a8; }
    .editor-content img, .editor-content video { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
    .editor-content a { color: #2f6fd6; }
    .media-placeholder { display: inline-block; background: #eef0f3; color: #4a52c4; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
    .media-placeholder.rejected { color: #c0392b; }
  </style>

    <input type="file" id="write-media-file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime" style="display:none">

  <script src="/js/app.js?v=20260828f"></script>
  <script src="/js/i18n.js?v=20260828f"></script>
  <script>
    var postEditor = createPostEditor({
      editorEl: document.getElementById('write-content'),
      fileInputEl: document.getElementById('write-media-file'),
      boldBtn: document.getElementById('fmt-bold'),
      italicBtn: document.getElementById('fmt-italic'),
      linkBtn: document.getElementById('fmt-link'),
      imageBtn: document.getElementById('fmt-image'),
      videoBtn: document.getElementById('fmt-video')
    });

    renderHeader();
    // nav 라벨: i18n 키가 해석되면 번역으로 교체, 아니면 HTML의 한국어 기본값 유지(옛 i18n.js 캐시 대비).
    // 헤더 메뉴(.navlink)와 하단 탭바(.bnav) 둘 다 data-navkey를 갖는다.
    document.querySelectorAll('[data-navkey]').forEach(function (el) {
      var key = el.getAttribute('data-navkey');
      var v = t(key);
      if (v && v !== key) {
        var label = el.querySelector('.bnav-label');
        (label || el).textContent = v;
      }
    });
    renderFeed();
    renderTop10();
    renderLanditRanking();

    function renderTop10() {
      document.getElementById('top10-heading').textContent = t('top10Heading');

      fetch('https://api.paceleague.co.kr/api/ranking/top10?lang=' + encodeURIComponent(getLang()))
        .then(function (res) { return res.json(); })
        .then(function (json) {
          var listEl = document.getElementById('top10-list');
          var items = (json && json.data) || [];

          if (items.length === 0) {
            listEl.innerHTML = '<li class="top10-empty">' + t('top10Empty') + '</li>';
            return;
          }

          listEl.innerHTML = items.map(function (item) {
            return '<li>' +
              '<span class="top10-rank rank-' + item.rank + '">' + item.rank + '</span>' +
              (item.crewIconUrl ? '<img class="top10-crew" src="' + escapeHtml(item.crewIconUrl) + '" alt="" title="' + escapeHtml(item.crewName || '') + '">' : '') +
              '<span class="top10-nickname">' + escapeHtml(item.nickname || '-') + '</span>' +
              '<span class="top10-tier">' + escapeHtml(item.tierLabel || item.tier) + '</span>' +
              '<span class="top10-score">' + item.totalScore + '</span>' +
              '</li>';
          }).join('');
        })
        .catch(function () {
          document.getElementById('top10-list').innerHTML = '<li class="top10-empty">' + t('top10LoadFailed') + '</li>';
        });
    }

    function formatAreaKm(sqkm) {
      return (Number(sqkm) || 0).toFixed(2) + ' km²';
    }

    function renderLanditRanking() {
      var headEl = document.getElementById('landit-rank-heading');
      if (t('territoryRanking') !== 'territoryRanking') headEl.textContent = t('territoryRanking');

      fetch(API_BASE + '/api/territory/ranking?lang=' + encodeURIComponent(getLang()))
        .then(function (res) { return res.json(); })
        .then(function (json) {
          var listEl = document.getElementById('landit-rank-list');
          var items = (json && json.data && json.data.entries) || [];
          if (items.length === 0) {
            listEl.innerHTML = '<li class="top10-empty">' + t('territoryRankEmpty') + '</li>';
            return;
          }
          listEl.innerHTML = items.slice(0, 10).map(function (item) {
            return '<li>' +
              '<span class="top10-rank rank-' + item.rank + '">' + item.rank + '</span>' +
              '<span class="top10-nickname">' + escapeHtml(item.nickname || '-') + '</span>' +
              '<span class="top10-tier">' + escapeHtml(item.ownerTierLabel || item.ownerTier || '') + '</span>' +
              '<span class="top10-score">⬡' + Number(item.totalHexCount || 0).toLocaleString() + ' · ' + formatAreaKm(item.totalAreaSqkm) + '</span>' +
              '</li>';
          }).join('');
        })
        .catch(function () {
          document.getElementById('landit-rank-list').innerHTML = '<li class="top10-empty">' + t('territoryLoadFailed') + '</li>';
        });
    }

    function renderHeader() {
      var actionsEl = document.getElementById('header-actions');
      var langSelectHtml = '<select id="lang-select"></select>';
      if (isLoggedIn()) {
        actionsEl.innerHTML =
          langSelectHtml +
          '<a class="btn ghost" href="/account.html">' + t('accountLink') + '</a>' +
          '<a class="btn ghost" href="#" id="logout-link">' + t('logout') + '</a>' +
          '<button class="btn" id="write-btn">' + t('write') + '</button>';
        document.getElementById('logout-link').addEventListener('click', function (e) {
          e.preventDefault();
          logout();
        });
      } else {
        actionsEl.innerHTML =
          langSelectHtml +
          '<a class="btn ghost" href="/join.html">' + t('goToJoin') + '</a>' +
          '<a class="btn ghost" href="/login.html">' + t('login') + '</a>' +
          '<button class="btn" id="write-btn">' + t('write') + '</button>';
      }
      renderLangSelect(document.getElementById('lang-select'));

      document.getElementById('write-board-label').textContent = t('boardSelectLabel');
      document.getElementById('write-title').placeholder = t('titlePlaceholder');
      document.getElementById('write-content').setAttribute('data-placeholder', t('contentPlaceholder'));
      document.getElementById('write-record-label').textContent = t('attachRecordLabel');
      document.getElementById('write-cancel').textContent = t('cancel');
      document.getElementById('write-submit').textContent = t('submit');

      document.getElementById('fmt-bold').title = t('editorBoldTitle');
      document.getElementById('fmt-italic').title = t('editorItalicTitle');
      document.getElementById('fmt-link').title = t('editorLinkTitle');
      document.getElementById('fmt-image').title = t('editorImageTitle');
      document.getElementById('fmt-video').title = t('editorVideoTitle');

      // 비로그인 상태에서 글쓰기를 누르면 로그인 페이지로 보낸다(작성/댓글/추천만 로그인 필요).
      document.getElementById('write-btn').addEventListener('click', function () {
        if (redirectToLoginIfNeeded()) return;
        document.getElementById('write-title').value = '';
        postEditor.reset();
        document.getElementById('write-error').textContent = '';
        loadRecordOptions(document.getElementById('write-record'));
        document.getElementById('write-dialog').showModal();
      });
    }

    function renderFeed() {
      document.getElementById('content').innerHTML =
        '<div class="feed-toolbar">' +
          '<div class="tabs" id="tabs"></div>' +
          '<div class="sort-buttons">' +
            '<button id="sort-new" class="active">' + t('sortNew') + '</button>' +
            '<button id="sort-top">' + t('sortTop') + '</button>' +
          '</div>' +
        '</div>' +
        '<ol class="post-list" id="post-list"></ol>' +
        '<div class="pager" id="pager"></div>';

      var boards = [];
      var currentBoardSno = null;
      var currentPage = 0;
      var currentSort = 'new';

      function boardSlugFromQuery() {
        return new URLSearchParams(window.location.search).get('board');
      }

      function renderTabs() {
        document.getElementById('tabs').innerHTML = boards.map(function (b) {
          var active = b.sno === currentBoardSno ? ' active' : '';
          return '<a class="tab' + active + '" href="/index.html?board=' + encodeURIComponent(b.slug) + '">' +
            escapeHtml(b.name) + '</a>';
        }).join('');
      }

      var titleBySno = {};
      var translatedTitleBySno = {};
      var showingTitleTranslation = {};

      function renderPosts(pageData) {
        var listEl = document.getElementById('post-list');
        var items = pageData.content || [];

        titleBySno = {};
        translatedTitleBySno = {};
        showingTitleTranslation = {};

        if (items.length === 0) {
          listEl.innerHTML = '<div class="empty">' + t('noPosts') + '</div>';
        } else {
          listEl.innerHTML = items.map(function (p) {
            titleBySno[p.sno] = p.title;

            var snippetHtml = p.contentSnippet
              ? '<div class="post-snippet post-open" data-sno="' + p.sno + '">' + escapeHtml(p.contentSnippet) + '</div>'
              : '';

            var thumbHtml = '';
            if (p.thumbnailUrl) {
              thumbHtml = '<div class="post-thumb post-open" data-sno="' + p.sno + '">' +
                (p.thumbnailType === 'VIDEO'
                  ? '<video src="' + escapeHtml(p.thumbnailUrl) + '" preload="metadata" muted></video>'
                  : '<img src="' + escapeHtml(p.thumbnailUrl) + '" loading="lazy" alt="">') +
                '</div>';
            }

            var tier = p.authorTier || 'SILVER';

            return '<li class="post-card">' +
              '<div class="post-vote">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5-5 5 5"/><path d="M12 6v13"/></svg>' +
                '<span class="post-vote-num">' + p.score + '</span>' +
              '</div>' +
              '<div class="post-body">' +
                '<div class="post-head">' +
                  '<div class="post-title post-open" data-sno="' + p.sno + '" id="post-title-' + p.sno + '">' + escapeHtml(p.title) + '</div>' +
                  '<span class="post-translate-link" data-sno="' + p.sno + '">' + t('translateShow') + '</span>' +
                '</div>' +
                '<div class="post-row">' +
                  '<div class="post-col">' +
                    snippetHtml +
                    '<div class="post-meta">' +
                      '<span class="post-author">' + escapeHtml(p.nickname) + '</span>' +
                      '<span class="author-tier tier-' + escapeHtml(tier) + '">' + escapeHtml(p.authorTierLabel || p.authorTier) + '</span>' +
                      (p.authorCrewName ? '<span class="crew-badge">' + (p.authorCrewIconUrl ? '<img src="' + escapeHtml(p.authorCrewIconUrl) + '" alt="">' : '') + escapeHtml(p.authorCrewName) + '</span>' : '') +
                      (p.recordSno ? '<span class="record-badge" title="' + escapeHtml(t('attachedRecordHeading')) + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v2l-4 3 3 4 5-2"/><path d="M4 17l3-1 2 3"/></svg></span>' : '') +
                      '<span>' + t('commentCountLabel') + ' ' + p.commentCount + '</span>' +
                      '<span>' + t('viewCountLabel') + ' ' + p.viewCount + '</span>' +
                      '<span>' + escapeHtml(formatLocalTime(p.createAt)) + '</span>' +
                    '</div>' +
                  '</div>' +
                  thumbHtml +
                '</div>' +
              '</div>' +
            '</li>';
          }).join('');

          listEl.querySelectorAll('.post-open').forEach(function (el) {
            el.addEventListener('click', function () {
              location.href = '/post.html?post=' + el.getAttribute('data-sno');
            });
          });
          listEl.querySelectorAll('.post-translate-link').forEach(function (el) {
            el.addEventListener('click', function (e) {
              e.stopPropagation();
              toggleTitleTranslation(el.getAttribute('data-sno'), el);
            });
          });
        }

        var pagerEl = document.getElementById('pager');
        pagerEl.innerHTML =
          '<button id="prev-page"' + (pageData.first ? ' disabled' : '') + '>' + t('prevPage') + '</button>' +
          '<button id="next-page"' + (pageData.last ? ' disabled' : '') + '>' + t('nextPage') + '</button>';
        document.getElementById('prev-page').addEventListener('click', function () {
          if (!pageData.first) { currentPage--; loadPosts(); }
        });
        document.getElementById('next-page').addEventListener('click', function () {
          if (!pageData.last) { currentPage++; loadPosts(); }
        });
      }

      function loadPosts() {
        apiFetch('/api/board/' + currentBoardSno + '/posts?page=' + currentPage + '&size=20&sort=' + currentSort + '&lang=' + encodeURIComponent(getLang()))
          .then(function (json) { renderPosts(json.data); });
      }

      function toggleTitleTranslation(sno, linkEl) {
        if (redirectToLoginIfNeeded()) return;
        var titleEl = document.getElementById('post-title-' + sno);

        if (showingTitleTranslation[sno]) {
          titleEl.textContent = titleBySno[sno];
          showingTitleTranslation[sno] = false;
          linkEl.textContent = t('translateShow');
          return;
        }

        if (translatedTitleBySno[sno]) {
          titleEl.textContent = translatedTitleBySno[sno];
          showingTitleTranslation[sno] = true;
          linkEl.textContent = t('translateHide');
          return;
        }

        apiFetch('/api/board/posts/' + sno + '/translate', {
          method: 'POST',
          body: { targetLanguage: getLang() }
        }).then(function (json) {
          if (!json.success) {
            alert(t('translateFailed'));
            return;
          }
          translatedTitleBySno[sno] = json.data.title;
          titleEl.textContent = json.data.title;
          showingTitleTranslation[sno] = true;
          linkEl.textContent = t('translateHide');
        });
      }

      function selectSort(sort) {
        currentSort = sort;
        currentPage = 0;
        document.getElementById('sort-new').classList.toggle('active', sort === 'new');
        document.getElementById('sort-top').classList.toggle('active', sort === 'top');
        loadPosts();
      }

      document.getElementById('sort-new').addEventListener('click', function () { selectSort('new'); });
      document.getElementById('sort-top').addEventListener('click', function () { selectSort('top'); });

      document.getElementById('write-submit').addEventListener('click', function () {
        var title = document.getElementById('write-title').value.trim();
        var content = postEditor.getContentHtml();
        var errorEl = document.getElementById('write-error');

        if (!title || postEditor.isBlank()) {
          errorEl.textContent = t('writeErrorEmpty');
          return;
        }
        if (postEditor.hasPending()) {
          errorEl.textContent = t('attachMediaPendingBlockSubmit');
          return;
        }

        var recordSnoValue = document.getElementById('write-record').value;
        var targetBoardSno = document.getElementById('write-board').value || currentBoardSno;

        apiFetch('/api/board/' + targetBoardSno + '/posts', {
          method: 'POST',
          body: {
            title: title, content: content,
            recordSno: recordSnoValue ? Number(recordSnoValue) : null
          }
        }).then(function (json) {
          if (!json.success) {
            errorEl.textContent = json.message || t('writeFailed');
            return;
          }
          postEditor.clearPollTimers();
          window.location.href = '/post.html?post=' + json.data.sno;
        });
      });
      document.getElementById('write-cancel').addEventListener('click', function () {
        document.getElementById('write-dialog').close();
      });

      apiFetch('/api/board?lang=' + encodeURIComponent(getLang())).then(function (json) {
        boards = json.data || [];
        var slug = boardSlugFromQuery();
        var selected = boards.find(function (b) { return b.slug === slug; }) || boards[0];
        if (!selected) {
          document.getElementById('post-list').innerHTML = '<div class="empty">' + t('noBoards') + '</div>';
          return;
        }
        currentBoardSno = selected.sno;

        var writeBoardSelect = document.getElementById('write-board');
        writeBoardSelect.innerHTML = boards.map(function (b) {
          return '<option value="' + b.sno + '">' + escapeHtml(b.name) + '</option>';
        }).join('');
        writeBoardSelect.value = currentBoardSno;

        renderTabs();
        loadPosts();
      });
    }
  </script>
</body>
</html>
