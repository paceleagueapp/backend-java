<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Pace League</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2124974034690240" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/app.css?v=20260908">

  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

  <style>
    /* 공용 스타일은 /css/app.css. 아래는 로그인 페이지 전용. */
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .brand { margin-bottom: 18px; }
    .brand-name { color: #1c2024; }
    #lang-select { background: #fff; color: #4a4e56; border: 1px solid #d7dade; border-radius: 10px; padding: 6px 10px; margin-bottom: 22px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #1c2024; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    form input { padding: 12px 14px; border-radius: 10px; font-size: 15px; }
    form button {
      background: #e5342f; color: #fff; border: none; padding: 12px; border-radius: 24px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
    form button:hover { background: #c62828; }
    .error { color: #d02b22; font-size: 13px; min-height: 18px; }
    a.back { color: #8a8e96; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <a class="brand" href="/index.html">
    <img class="brand-mark" src="/img/favicon.png" alt="PACELEAGUE">
    <span class="brand-name">PACELEAGUE</span>
  </a>
  <select id="lang-select"></select>
  <h1 id="login-heading"></h1>
  <form id="login-form">
    <input type="text" id="memberId" autocomplete="username" required>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit" id="login-submit"></button>
  </form>
  <a class="back" id="back-link" href="/index.html"></a>

  <script src="/js/app.js?v=20260828f"></script>
  <script src="/js/i18n.js?v=20260828f"></script>
  <script>
    renderLangSelect(document.getElementById('lang-select'));
    document.getElementById('login-heading').textContent = t('loginHeading');
    document.getElementById('memberId').placeholder = t('memberIdPlaceholder');
    document.getElementById('password').placeholder = t('passwordPlaceholder');
    document.getElementById('login-submit').textContent = t('login');
    document.getElementById('back-link').textContent = t('backToMain');

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var memberId = document.getElementById('memberId').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      login(memberId, password)
        .then(function (data) {
          storeAuth(data);
          window.location.href = '/index.html';
        })
        .catch(function (err) {
          errorEl.textContent = err.message || t('loginFailed');
        });
    });
  </script>
</body>
</html>
