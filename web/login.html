<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Pace League</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #e53935; }
    button {
      background: #e53935;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #c62828; }
    .error { color: #ff6b6b; font-size: 13px; min-height: 18px; }
    a.back { color: #888; font-size: 13px; margin-top: 20px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Pace League 로그인</h1>
  <form id="login-form">
    <input type="text" id="memberId" placeholder="아이디" autocomplete="username" required>
    <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit">로그인</button>
  </form>
  <a class="back" href="/index.html">← 메인으로</a>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var memberId = document.getElementById('memberId').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      login(memberId, password)
        .then(function (data) {
          storeAuth(data);
          window.location.href = '/board.html';
        })
        .catch(function (err) {
          errorEl.textContent = err.message || '로그인에 실패했습니다.';
        });
    });
  </script>
</body>
</html>
