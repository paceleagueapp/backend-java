<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Pace League</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; margin-bottom: 20px; }
    .brand .site-logo { height: 32px; width: auto; display: block; }
    .brand .site-name { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #e53935; }
    button {
      background: #e53935;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #c62828; }
    .error { color: #ff6b6b; font-size: 13px; min-height: 18px; }
    a.back { color: #888; font-size: 13px; margin-top: 20px; text-decoration: none; }
    #lang-select {
      background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 16px;
      padding: 6px 10px; font-size: 13px; cursor: pointer; margin-bottom: 20px;
    }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <a class="brand" href="/index.html">
    <img class="site-logo" src="/img/logo.png" alt="Pace League">
    <span class="site-name">PACELEAGUE</span>
  </a>
  <select id="lang-select"></select>
  <h1 id="login-heading"></h1>
  <form id="login-form">
    <input type="text" id="memberId" autocomplete="username" required>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit" id="login-submit"></button>
  </form>
  <a class="back" id="back-link" href="/index.html"></a>

  <script src="/js/app.js?v=20260828c"></script>
  <script src="/js/i18n.js?v=20260828c"></script>
  <script>
    renderLangSelect(document.getElementById('lang-select'));
    document.getElementById('login-heading').textContent = t('loginHeading');
    document.getElementById('memberId').placeholder = t('memberIdPlaceholder');
    document.getElementById('password').placeholder = t('passwordPlaceholder');
    document.getElementById('login-submit').textContent = t('login');
    document.getElementById('back-link').textContent = t('backToMain');

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var memberId = document.getElementById('memberId').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      login(memberId, password)
        .then(function (data) {
          storeAuth(data);
          window.location.href = '/index.html';
        })
        .catch(function (err) {
          errorEl.textContent = err.message || t('loginFailed');
        });
    });
  </script>
</body>
</html>
