<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 수신 동의 - Pace League</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20260908">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K4Q3GDB8');</script>
  <!-- End Google Tag Manager -->
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .brand { margin-bottom: 18px; }
    .brand-name { color: #1c2024; }
    #lang-select { background: #fff; color: #4a4e56; border: 1px solid #d7dade; border-radius: 10px; padding: 6px 10px; margin-bottom: 22px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #1c2024; text-align: center; }
    .sub { font-size: 13px; color: #8a8e96; margin-bottom: 20px; text-align: center; max-width: 360px; }
    .panel { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
    .consent-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; background: #fff; }
    .consent-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .consent-title { font-size: 14.5px; font-weight: 700; color: #1c2024; }
    .consent-desc { font-size: 12.5px; color: #8a8e96; margin-top: 6px; line-height: 1.5; }
    .consent-sub { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e5e7eb; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #d7dade; border-radius: 22px; transition: .15s; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .15s; }
    input:checked + .slider { background: #e5342f; }
    input:checked + .slider:before { transform: translateX(18px); }
    input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }
    button#save-btn {
      background: #e5342f; color: #fff; border: none; padding: 12px; border-radius: 24px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    button#save-btn:hover { background: #c62828; }
    .error { color: #d02b22; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <a class="brand" href="/index.html">
    <img class="brand-mark" src="/img/favicon.png" alt="PACELEAGUE">
    <span class="brand-name">PACELEAGUE</span>
  </a>
  <select id="lang-select"></select>
  <h1 id="nc-heading"></h1>
  <p class="sub" id="nc-sub"></p>

  <div class="panel">
    <div class="consent-card">
      <div class="consent-head">
        <span class="consent-title" id="nc-push-title"></span>
        <label class="switch"><input type="checkbox" id="nc-push" checked><span class="slider"></span></label>
      </div>
      <div class="consent-desc" id="nc-push-desc"></div>
    </div>

    <div class="consent-card">
      <div class="consent-head">
        <span class="consent-title" id="nc-marketing-title"></span>
        <label class="switch"><input type="checkbox" id="nc-marketing"><span class="slider"></span></label>
      </div>
      <div class="consent-desc" id="nc-marketing-desc"></div>
      <div class="consent-sub consent-head">
        <span class="consent-title" id="nc-marketing-night-title" style="font-weight: 600; font-size: 13px;"></span>
        <label class="switch"><input type="checkbox" id="nc-marketing-night" disabled><span class="slider"></span></label>
      </div>
    </div>

    <div class="error" id="error"></div>
    <button id="save-btn"></button>
  </div>

  <script src="/js/app.js?v=20260910"></script>
  <script src="/js/i18n.js?v=20260910"></script>
  <script>
    if (redirectToLoginIfNeeded()) {
      // 로그인 페이지로 이동 처리됨
    }

    renderLangSelect(document.getElementById('lang-select'));
    document.getElementById('nc-heading').textContent = t('ncHeading');
    document.getElementById('nc-sub').textContent = t('ncSub');
    document.getElementById('nc-push-title').textContent = t('ncPushTitle');
    document.getElementById('nc-push-desc').textContent = t('ncPushDesc');
    document.getElementById('nc-marketing-title').textContent = t('ncMarketingTitle');
    document.getElementById('nc-marketing-desc').textContent = t('ncMarketingDesc');
    document.getElementById('nc-marketing-night-title').textContent = t('ncMarketingNightTitle');
    document.getElementById('save-btn').textContent = t('ncSave');

    var marketingBox = document.getElementById('nc-marketing');
    var marketingNightBox = document.getElementById('nc-marketing-night');
    marketingBox.addEventListener('change', function () {
      marketingNightBox.disabled = !marketingBox.checked;
      if (!marketingBox.checked) marketingNightBox.checked = false;
    });

    document.getElementById('save-btn').addEventListener('click', function () {
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      saveMemberAgreements([
        { agreementType: 'PUSH_SERVICE', agreed: document.getElementById('nc-push').checked },
        { agreementType: 'MARKETING', agreed: marketingBox.checked },
        { agreementType: 'MARKETING_NIGHT', agreed: marketingNightBox.checked }
      ]).then(function (json) {
        if (!json.success) { throw new Error(json.message || t('ncSaveFailed')); }
        window.location.href = '/index.html';
      }).catch(function (err) {
        errorEl.textContent = (err && err.message) || t('ncSaveFailed');
      });
    });
  </script>
</body>
</html>
