<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림내역 - Pace League</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261027">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K4Q3GDB8');</script>
  <!-- End Google Tag Manager -->
  <style>
    body { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .brand { margin-bottom: 18px; }
    .brand-name { color: #1c2024; }
    #lang-select { background: #fff; color: #4a4e56; border: 1px solid #d7dade; border-radius: 10px; padding: 6px 10px; margin-bottom: 22px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #1c2024; }
    .panel { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
    #notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; background: #fff; }
    .notif-title { font-size: 14.5px; font-weight: 700; color: #1c2024; }
    .notif-body { font-size: 13.5px; color: #4a4e56; margin-top: 6px; line-height: 1.5; white-space: pre-line; }
    .notif-time { font-size: 12px; color: #8a8e96; margin-top: 8px; }
    .empty { text-align: center; color: #8a8e96; font-size: 14px; padding: 28px 0; }
    .msg { font-size: 13px; min-height: 18px; color: #d02b22; text-align: center; }
    button#more-btn {
      background: #fff; color: #4a4e56; border: 1px solid #d7dade; padding: 11px; border-radius: 24px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button#more-btn:hover { background: #f2f3f5; }
    button#more-btn:disabled { opacity: 0.5; cursor: default; }
    a.back { color: #8a8e96; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <a class="brand" href="/">
    <img class="brand-mark" src="/img/favicon.png" alt="PACELEAGUE">
    <span class="brand-name">PACELEAGUE</span>
  </a>
  <select id="lang-select"></select>
  <h1 id="notif-heading"></h1>

  <div class="panel">
    <div id="notif-list"></div>
    <div class="msg" id="msg"></div>
    <button id="more-btn" hidden></button>
  </div>

  <a class="back" id="back-link" href="/"></a>

  <script src="/js/app.js?v=20261027"></script>
  <script src="/js/i18n.js?v=20261027"></script>
  <script>
    if (redirectToLoginIfNeeded()) {
      // 로그인 페이지로 이동 처리됨
    }

    var PAGE_SIZE = 5;
    var listEl = document.getElementById('notif-list');
    var moreBtn = document.getElementById('more-btn');
    var msgEl = document.getElementById('msg');
    var nextCursor = null;

    renderLangSelect(document.getElementById('lang-select'));
    document.title = t('notifHeading') + ' - Pace League';
    document.getElementById('notif-heading').textContent = t('notifHeading');
    document.getElementById('back-link').textContent = t('accountBack');
    moreBtn.textContent = t('notifMore');

    function renderItem(n) {
      var card = document.createElement('div');
      card.className = 'notif-card';
      card.innerHTML = '<div class="notif-title">' + escapeHtml(n.title) + '</div>'
        + '<div class="notif-body">' + escapeHtml(n.body) + '</div>'
        + '<div class="notif-time">' + escapeHtml(formatLocalTime(n.createdAt)) + '</div>';
      listEl.appendChild(card);
    }

    // 처음 5개, 이후 '더보기'마다 다음 5개 — 응답의 nextCursor 를 다음 요청 cursor 로 넘긴다.
    function loadPage() {
      moreBtn.disabled = true;
      msgEl.textContent = '';
      var path = '/api/notification?size=' + PAGE_SIZE + (nextCursor != null ? '&cursor=' + nextCursor : '');
      apiFetch(path).then(function (json) {
        if (!json.success) { throw new Error(json.message); }
        var page = json.data;
        page.items.forEach(renderItem);
        if (!listEl.children.length) {
          listEl.innerHTML = '<div class="empty">' + escapeHtml(t('notifEmpty')) + '</div>';
        }
        nextCursor = page.nextCursor;
        moreBtn.hidden = !page.hasMore;
        moreBtn.disabled = false;
      }).catch(function () {
        msgEl.textContent = t('notifLoadFailed');
        moreBtn.disabled = false;
      });
    }

    moreBtn.addEventListener('click', loadPage);
    if (isLoggedIn()) loadPage();
  </script>
</body>
</html>
