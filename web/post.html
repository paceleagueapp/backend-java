<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 - Pace League</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <!-- Google Tag Manager -->

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K4Q3GDB8');</script>
  <!-- End Google Tag Manager -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    nav a { color: #ccc; text-decoration: none; font-size: 13px; margin-left: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; margin-bottom: 14px; }
    .brand .site-logo { height: 24px; width: auto; display: block; }
    .brand .site-name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    #lang-select {
      background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 16px;
      padding: 6px 10px; font-size: 13px; cursor: pointer;
    }

    .post-box { background: #1a1a1a; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    .post-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .post-meta { font-size: 12px; color: #888; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
    .author-tier { background: #262626; color: #ccc; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
    .crew-badge { display: inline-flex; align-items: center; gap: 3px; background: #26264a; color: #b7b7e8; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
    .crew-badge img { width: 12px; height: 12px; border-radius: 3px; object-fit: cover; }
    .post-content { font-size: 14px; line-height: 1.6; margin-bottom: 14px; word-break: break-word; }
    .post-content p { margin-bottom: 8px; }
    .post-content img, .post-content video { max-width: 100%; border-radius: 8px; display: block; margin: 8px 0; }
    .post-content a { color: #64b5f6; word-break: break-all; }
    .attached-record { background: #0f0f0f; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; color: #ccc; }
    .attached-record .attached-record-heading { font-size: 11px; color: #888; margin-bottom: 4px; }
    .vote-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .vote-btn {
      background: #0f0f0f; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .vote-btn.active-up { background: #e53935; color: #fff; border-color: #e53935; }
    .vote-btn.active-down { background: #3949ab; color: #fff; border-color: #3949ab; }
    .translate-btn { background: none; border: 1px solid #333; color: #888; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .score-text { font-size: 14px; font-weight: 700; }
    .edit-link { margin-left: auto; color: #888; font-size: 12px; cursor: pointer; }
    .delete-link { margin-left: 10px; color: #888; font-size: 12px; cursor: pointer; }

    #post-edit-box input, #post-edit-box select {
      width: 100%; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px;
    }
    #post-edit-box label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    #post-edit-box .actions { display: flex; justify-content: flex-end; gap: 8px; }
    #post-edit-box .actions button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }
    #post-edit-box button.save { background: #e53935; color: #fff; }
    #post-edit-box button.cancel { background: #333; color: #ccc; }

    .editor-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .editor-toolbar button {
      background: #0f0f0f; border: 1px solid #333; color: #ccc; width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer; font-size: 14px; padding: 0;
    }
    .editor-toolbar button:hover { background: #262626; }
    .editor-content {
      width: 100%; min-height: 120px; max-height: 320px; overflow-y: auto;
      background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    }
    .editor-content.is-empty:before { content: attr(data-placeholder); color: #666; }
    .editor-content img, .editor-content video { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
    .editor-content a { color: #64b5f6; }
    .media-placeholder { display: inline-block; background: #262626; color: #9aa5e8; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
    .media-placeholder.rejected { color: #ff8a80; }

    .comments-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .comment-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .comment-form textarea {
      background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; min-height: 60px; resize: vertical;
    }
    .comment-form button { align-self: flex-end; background: #e53935; color: #fff; border: none; padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 13px; }

    .comment-item { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .comment-meta { font-size: 12px; color: #888; margin-bottom: 4px; display: flex; gap: 8px; }
    .comment-content { font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; }
    .comment-actions { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
    .comment-actions button { background: none; border: 1px solid #333; color: #ccc; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
    .comment-actions button.active-up { background: #e53935; color: #fff; border-color: #e53935; }
    .comment-actions button.active-down { background: #3949ab; color: #fff; border-color: #3949ab; }
    .comment-actions .reply-link, .comment-actions .delete-link, .comment-actions .translate-link { color: #888; cursor: pointer; }
    .replies { margin-left: 20px; margin-top: 8px; }
    .reply-form { display: none; margin-top: 8px; gap: 6px; flex-direction: column; }
    .reply-form textarea { background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; min-height: 40px; }
    .reply-form button { align-self: flex-end; background: #e53935; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; }
    .empty { text-align: center; color: #666; padding: 20px; }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <div class="wrap">
    <a class="brand" href="/index.html">
      <img class="site-logo" src="/img/logo.png" alt="Pace League">
      <span class="site-name">PACELEAGUE</span>
    </a>
    <nav>
      <a href="javascript:history.back()" id="back-link"></a>
      <span>
        <a href="/index.html" id="main-link"></a>
        <select id="lang-select"></select>
      </span>
    </nav>

    <div class="post-box" id="post-box"></div>

    <div class="post-box" id="post-edit-box" style="display:none;">
      <input type="text" id="edit-title" maxlength="200">
      <div class="editor-toolbar" id="edit-toolbar">
        <button type="button" id="edit-fmt-bold"><b>B</b></button>
        <button type="button" id="edit-fmt-italic"><i>I</i></button>
        <button type="button" id="edit-fmt-link">🔗</button>
        <button type="button" id="edit-fmt-image">🖼️</button>
        <button type="button" id="edit-fmt-video">🎬</button>
      </div>
      <div id="edit-content" class="editor-content is-empty" contenteditable="true"></div>
      <input type="file" id="edit-media-file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime" style="display:none">
      <label id="edit-record-label" for="edit-record"></label>
      <select id="edit-record"></select>
      <div class="error" id="edit-error" style="color:#ff6b6b;font-size:13px;margin-bottom:8px;"></div>
      <div class="actions">
        <button class="cancel" id="edit-cancel"></button>
        <button class="save" id="edit-save"></button>
      </div>
    </div>

    <div class="comments-title" id="comments-title"></div>
    <div class="comment-form">
      <textarea id="comment-content"></textarea>
      <button id="comment-submit"></button>
    </div>
    <div id="comment-list"></div>
  </div>

  <script src="/js/app.js?v=20260828e"></script>
  <script src="/js/i18n.js?v=20260828e"></script>
  <script>
    renderLangSelect(document.getElementById('lang-select'));
    document.getElementById('back-link').textContent = t('backToList');
    document.getElementById('main-link').textContent = t('mainLink');
    document.getElementById('comments-title').textContent = t('commentsTitle');
    document.getElementById('comment-content').placeholder = t('commentPlaceholder');
    document.getElementById('comment-submit').textContent = t('commentSubmit');

    document.getElementById('edit-title').placeholder = t('titlePlaceholder');
    document.getElementById('edit-content').setAttribute('data-placeholder', t('contentPlaceholder'));
    document.getElementById('edit-record-label').textContent = t('attachRecordLabel');
    document.getElementById('edit-cancel').textContent = t('cancel');
    document.getElementById('edit-save').textContent = t('saveLabel');
    document.getElementById('edit-fmt-bold').title = t('editorBoldTitle');
    document.getElementById('edit-fmt-italic').title = t('editorItalicTitle');
    document.getElementById('edit-fmt-link').title = t('editorLinkTitle');
    document.getElementById('edit-fmt-image').title = t('editorImageTitle');
    document.getElementById('edit-fmt-video').title = t('editorVideoTitle');

    var editPostEditor = createPostEditor({
      editorEl: document.getElementById('edit-content'),
      fileInputEl: document.getElementById('edit-media-file'),
      boldBtn: document.getElementById('edit-fmt-bold'),
      italicBtn: document.getElementById('edit-fmt-italic'),
      linkBtn: document.getElementById('edit-fmt-link'),
      imageBtn: document.getElementById('edit-fmt-image'),
      videoBtn: document.getElementById('edit-fmt-video')
    });

    var postSno = new URLSearchParams(window.location.search).get('post');
    var myMemberSno = getMemberSno();

    var postOriginal = null;
    var postTranslated = null;
    var showingPostTranslation = false;
    var commentTranslations = {}; // sno -> translated content
    var showingCommentTranslation = {}; // sno -> boolean

    function loadPost() {
      apiFetch('/api/board/posts/' + postSno + '?lang=' + encodeURIComponent(getLang())).then(function (json) {
        postOriginal = { title: json.data.title, content: json.data.content };
        postTranslated = null;
        showingPostTranslation = false;
        renderPost(json.data);
      });
    }

    function renderPost(post) {
      var isMine = myMemberSno && post.memberSno === myMemberSno;
      var upClass = post.myVote === 1 ? ' active-up' : '';
      var downClass = post.myVote === -1 ? ' active-down' : '';

      var recordHtml = '';
      if (post.attachedRecord) {
        var r = post.attachedRecord;
        recordHtml = '<div class="attached-record">' +
          '<div class="attached-record-heading">🏃 ' + t('attachedRecordHeading') + '</div>' +
          '<div>' + formatDistanceKm(r.distance) + ' · ' + formatPace(r.distance, r.startTime, r.endTime) +
          ' · ' + escapeHtml(formatRecordDateTime(r.startTime)) + '</div>' +
        '</div>';
      }

      document.getElementById('post-box').innerHTML =
        '<div class="post-title" id="post-title">' + escapeHtml(post.title) + '</div>' +
        '<div class="post-meta">' +
          '<span>' + escapeHtml(post.nickname) + '</span>' +
          '<span class="author-tier">' + escapeHtml(post.authorTierLabel || post.authorTier) + '</span>' +
          (post.authorCrewName ? '<span class="crew-badge">' + (post.authorCrewIconUrl ? '<img src="' + escapeHtml(post.authorCrewIconUrl) + '" alt="">' : '') + escapeHtml(post.authorCrewName) + '</span>' : '') +
          '<span>' + t('viewCountLabel') + ' ' + post.viewCount + '</span>' +
          '<span>' + escapeHtml(formatLocalTime(post.createAt)) + '</span>' +
        '</div>' +
        recordHtml +
        '<div class="post-content" id="post-content">' + post.content + '</div>' +
        '<div class="vote-row">' +
          '<button class="vote-btn' + upClass + '" id="post-up">' + t('voteUp') + '</button>' +
          '<span class="score-text" id="post-score">' + post.score + '</span>' +
          '<button class="vote-btn' + downClass + '" id="post-down">' + t('voteDown') + '</button>' +
          '<button class="translate-btn" id="post-translate">' + t('translateShow') + '</button>' +
          (isMine ? '<span class="edit-link" id="post-edit">' + t('editLink') + '</span>' : '') +
          (isMine ? '<span class="delete-link" id="post-delete">' + t('delete') + '</span>' : '') +
        '</div>';

      document.getElementById('post-up').addEventListener('click', function () { votePost(1); });
      document.getElementById('post-down').addEventListener('click', function () { votePost(-1); });
      document.getElementById('post-translate').addEventListener('click', togglePostTranslation);
      if (isMine) {
        document.getElementById('post-edit').addEventListener('click', function () {
          if (redirectToLoginIfNeeded()) return;
          openEditMode(post);
        });
        document.getElementById('post-delete').addEventListener('click', function () {
          if (redirectToLoginIfNeeded()) return;
          if (!confirm(t('confirmDeletePost'))) return;
          apiFetch('/api/board/posts/' + postSno, { method: 'DELETE' }).then(function () {
            window.location.href = '/index.html';
          });
        });
      }
    }

    function openEditMode(post) {
      document.getElementById('edit-title').value = post.title;
      editPostEditor.reset(post.content);
      document.getElementById('edit-error').textContent = '';
      loadRecordOptions(document.getElementById('edit-record'), post.recordSno, post.attachedRecord);
      document.getElementById('post-box').style.display = 'none';
      document.getElementById('post-edit-box').style.display = 'block';
    }

    function closeEditMode() {
      editPostEditor.clearPollTimers();
      document.getElementById('post-edit-box').style.display = 'none';
      document.getElementById('post-box').style.display = 'block';
    }

    document.getElementById('edit-cancel').addEventListener('click', closeEditMode);
    document.getElementById('edit-save').addEventListener('click', function () {
      var title = document.getElementById('edit-title').value.trim();
      var content = editPostEditor.getContentHtml();
      var errorEl = document.getElementById('edit-error');

      if (!title || editPostEditor.isBlank()) {
        errorEl.textContent = t('writeErrorEmpty');
        return;
      }
      if (editPostEditor.hasPending()) {
        errorEl.textContent = t('attachMediaPendingBlockSubmit');
        return;
      }

      var recordSnoValue = document.getElementById('edit-record').value;

      apiFetch('/api/board/posts/' + postSno, {
        method: 'PUT',
        body: {
          title: title, content: content,
          recordSno: recordSnoValue ? Number(recordSnoValue) : null
        }
      }).then(function (json) {
        if (!json.success) {
          errorEl.textContent = json.message || t('editFailed');
          return;
        }
        editPostEditor.clearPollTimers();
        document.getElementById('post-edit-box').style.display = 'none';
        document.getElementById('post-box').style.display = 'block';
        loadPost();
      });
    });

    function togglePostTranslation() {
      if (redirectToLoginIfNeeded()) return;
      var btn = document.getElementById('post-translate');

      if (showingPostTranslation) {
        document.getElementById('post-title').textContent = postOriginal.title;
        document.getElementById('post-content').innerHTML = postOriginal.content;
        showingPostTranslation = false;
        btn.textContent = t('translateShow');
        return;
      }

      if (postTranslated) {
        applyPostTranslation();
        return;
      }

      apiFetch('/api/board/posts/' + postSno + '/translate', {
        method: 'POST',
        body: { targetLanguage: getLang() }
      }).then(function (json) {
        if (!json.success) {
          alert(t('translateFailed'));
          return;
        }
        postTranslated = json.data;
        applyPostTranslation();
      });
    }

    function applyPostTranslation() {
      document.getElementById('post-title').textContent = postTranslated.title;
      document.getElementById('post-content').textContent = postTranslated.content;
      showingPostTranslation = true;
      document.getElementById('post-translate').textContent = t('translateHide');
    }

    function votePost(voteValue) {
      if (redirectToLoginIfNeeded()) return;
      apiFetch('/api/board/posts/' + postSno + '/vote', {
        method: 'POST',
        body: { voteValue: voteValue }
      }).then(function () { loadPost(); });
    }

    function commentHtml(c, isReply) {
      var isMine = myMemberSno && c.memberSno === myMemberSno;
      var upClass = c.myVote === 1 ? ' active-up' : '';
      var downClass = c.myVote === -1 ? ' active-down' : '';

      var html = '<div class="comment-item" data-sno="' + c.sno + '" data-original="' + escapeHtml(c.content) + '">' +
        '<div class="comment-meta"><span>' + escapeHtml(c.nickname) + '</span><span>' + escapeHtml(formatLocalTime(c.createAt)) + '</span></div>' +
        '<div class="comment-content" id="comment-content-' + c.sno + '">' + escapeHtml(c.content) + '</div>' +
        '<div class="comment-actions">' +
          '<button class="vote-up' + upClass + '" data-sno="' + c.sno + '">▲</button>' +
          '<span>' + c.score + '</span>' +
          '<button class="vote-down' + downClass + '" data-sno="' + c.sno + '">▼</button>' +
          '<span class="translate-link" data-sno="' + c.sno + '">' + t('translateShow') + '</span>';

      if (!isReply) {
        html += '<span class="reply-link" data-sno="' + c.sno + '">' + t('replyLink') + '</span>';
      }
      if (isMine) {
        html += '<span class="delete-link" data-sno="' + c.sno + '">' + t('delete') + '</span>';
      }
      html += '</div>';

      if (!isReply) {
        html += '<div class="reply-form" data-parent="' + c.sno + '">' +
          '<textarea placeholder="' + t('replyPlaceholder') + '"></textarea>' +
          '<button data-parent="' + c.sno + '">' + t('submit') + '</button>' +
          '</div>';
      }

      if (!isReply && c.replies && c.replies.length > 0) {
        html += '<div class="replies">' + c.replies.map(function (r) { return commentHtml(r, true); }).join('') + '</div>';
      }

      html += '</div>';
      return html;
    }

    function loadComments() {
      apiFetch('/api/board/posts/' + postSno + '/comments').then(function (json) {
        commentTranslations = {};
        showingCommentTranslation = {};
        renderComments(json.data || []);
      });
    }

    function renderComments(comments) {
      var listEl = document.getElementById('comment-list');
      if (comments.length === 0) {
        listEl.innerHTML = '<div class="empty">' + t('noComments') + '</div>';
        return;
      }
      listEl.innerHTML = comments.map(function (c) { return commentHtml(c, false); }).join('');

      listEl.querySelectorAll('.vote-up').forEach(function (btn) {
        btn.addEventListener('click', function () { voteComment(btn.getAttribute('data-sno'), 1); });
      });
      listEl.querySelectorAll('.vote-down').forEach(function (btn) {
        btn.addEventListener('click', function () { voteComment(btn.getAttribute('data-sno'), -1); });
      });
      listEl.querySelectorAll('.delete-link').forEach(function (el) {
        el.addEventListener('click', function () { deleteComment(el.getAttribute('data-sno')); });
      });
      listEl.querySelectorAll('.translate-link').forEach(function (el) {
        el.addEventListener('click', function () { toggleCommentTranslation(el.getAttribute('data-sno'), el); });
      });
      listEl.querySelectorAll('.reply-link').forEach(function (el) {
        el.addEventListener('click', function () {
          var form = listEl.querySelector('.reply-form[data-parent="' + el.getAttribute('data-sno') + '"]');
          form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
        });
      });
      listEl.querySelectorAll('.reply-form button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parentSno = btn.getAttribute('data-parent');
          var form = listEl.querySelector('.reply-form[data-parent="' + parentSno + '"]');
          var textarea = form.querySelector('textarea');
          submitComment(textarea.value.trim(), Number(parentSno), textarea);
        });
      });
    }

    function toggleCommentTranslation(commentSno, linkEl) {
      if (redirectToLoginIfNeeded()) return;
      var contentEl = document.getElementById('comment-content-' + commentSno);
      var itemEl = document.querySelector('.comment-item[data-sno="' + commentSno + '"]');
      var original = itemEl.getAttribute('data-original');

      if (showingCommentTranslation[commentSno]) {
        contentEl.textContent = original;
        showingCommentTranslation[commentSno] = false;
        linkEl.textContent = t('translateShow');
        return;
      }

      if (commentTranslations[commentSno]) {
        contentEl.textContent = commentTranslations[commentSno];
        showingCommentTranslation[commentSno] = true;
        linkEl.textContent = t('translateHide');
        return;
      }

      apiFetch('/api/board/comments/' + commentSno + '/translate', {
        method: 'POST',
        body: { targetLanguage: getLang() }
      }).then(function (json) {
        if (!json.success) {
          alert(t('translateFailed'));
          return;
        }
        commentTranslations[commentSno] = json.data.content;
        contentEl.textContent = json.data.content;
        showingCommentTranslation[commentSno] = true;
        linkEl.textContent = t('translateHide');
      });
    }

    function voteComment(commentSno, voteValue) {
      if (redirectToLoginIfNeeded()) return;
      apiFetch('/api/board/comments/' + commentSno + '/vote', {
        method: 'POST',
        body: { voteValue: voteValue }
      }).then(function () { loadComments(); });
    }

    function deleteComment(commentSno) {
      if (redirectToLoginIfNeeded()) return;
      if (!confirm(t('confirmDeleteComment'))) return;
      apiFetch('/api/board/comments/' + commentSno, { method: 'DELETE' }).then(function () { loadComments(); });
    }

    function submitComment(content, parentCommentSno, clearTarget) {
      if (!content) return;
      if (redirectToLoginIfNeeded()) return;
      apiFetch('/api/board/posts/' + postSno + '/comments', {
        method: 'POST',
        body: { content: content, parentCommentSno: parentCommentSno || null }
      }).then(function (json) {
        if (!json.success) { return; }
        if (clearTarget) clearTarget.value = '';
        loadComments();
      });
    }

    document.getElementById('comment-submit').addEventListener('click', function () {
      var textarea = document.getElementById('comment-content');
      submitComment(textarea.value.trim(), null, textarea);
    });

    loadPost();
    loadComments();
  </script>
</body>
</html>
