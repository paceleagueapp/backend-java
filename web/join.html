<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>회원가입 - Pace League</title>
  <meta name="description" content="페이스리그 회원가입 - 러닝 기록, 랭킹, 랜드잇, 크루 서비스를 무료로 시작하세요.">
  <link rel="canonical" href="https://paceleague.co.kr/join">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/app.css?v=20261027">
  <!-- Google Tag Manager -->

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K4Q3GDB8');</script>
  <!-- End Google Tag Manager -->
  <style>
    /* 공용 스타일은 /css/app.css. 아래는 회원가입 페이지 전용. */
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .brand { margin-bottom: 18px; }
    .brand-name { color: #1c2024; }
    #lang-select { background: #fff; color: #4a4e56; border: 1px solid #d7dade; border-radius: 10px; padding: 6px 10px; margin-bottom: 22px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #1c2024; }
    form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
    form input { padding: 12px 14px; border-radius: 10px; font-size: 15px; }
    form button {
      background: #e5342f; color: #fff; border: none; padding: 12px; border-radius: 24px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
    form button:hover { background: #c62828; }
    form button:disabled, form button.is-locked { background: #d7dade; cursor: not-allowed; }
    form button.is-locked:hover { background: #d7dade; }
    .error { color: #d02b22; font-size: 13px; min-height: 18px; }
    a.back { color: #8a8e96; font-size: 13px; margin-top: 20px; }
    .agree-box { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .agree-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #4a4e56; }
    .agree-row input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; }
    .agree-row a { color: #1c2024; text-decoration: underline; margin-left: auto; white-space: nowrap; }
    .agree-all { font-weight: 700; color: #1c2024; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    .agree-note { font-size: 12px; color: #8a8e96; margin-top: -2px; }
    .agree-optional-first { border-top: 1px solid #e5e7eb; padding-top: 8px; }
    .agree-sub { padding-left: 24px; font-size: 13px; }
    .agree-row input:disabled + span { color: #b0b4ba; }
    .agree-hint { font-size: 12.5px; color: #c62828; text-align: center; margin-top: 2px; }
    .agree-hint[hidden] { display: none; }
    .agree-box.highlight { border-color: #e5342f; box-shadow: 0 0 0 3px rgba(229,52,47,0.12); }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4Q3GDB8"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <a class="brand" href="/">
    <img class="brand-mark" src="/img/favicon.png" alt="PACELEAGUE">
    <span class="brand-name">PACELEAGUE</span>
  </a>
  <select id="lang-select"></select>
  <h1 id="join-heading"></h1>
  <form id="join-form">
    <input type="text" id="memberId" autocomplete="username" required>
    <input type="password" id="password" autocomplete="new-password" required minlength="8">
    <input type="text" id="nickname" autocomplete="nickname">
    <input type="email" id="email" autocomplete="email">

    <div class="agree-box">
      <label class="agree-row agree-all">
        <input type="checkbox" id="agree-all">
        <span id="agree-all-label"></span>
      </label>
      <label class="agree-row">
        <input type="checkbox" id="agree-terms" class="agree-required">
        <span id="agree-terms-label"></span>
        <a href="/ko/terms" target="_blank" rel="noopener" id="agree-terms-link"></a>
      </label>
      <label class="agree-row">
        <input type="checkbox" id="agree-privacy" class="agree-required">
        <span id="agree-privacy-label"></span>
        <a href="/ko/privacy" target="_blank" rel="noopener" id="agree-privacy-link"></a>
      </label>
      <label class="agree-row">
        <input type="checkbox" id="agree-location" class="agree-required">
        <span id="agree-location-label"></span>
        <a href="/ko/location-terms" target="_blank" rel="noopener" id="agree-location-link"></a>
      </label>
      <div class="agree-note" id="agree-note"></div>
      <!-- 선택 동의(알림 3종) — 계정설정에서 언제든 바꿀 수 있다 -->
      <label class="agree-row agree-optional-first">
        <input type="checkbox" id="agree-push" class="agree-optional">
        <span id="agree-push-label"></span>
      </label>
      <label class="agree-row">
        <input type="checkbox" id="agree-marketing" class="agree-optional">
        <span id="agree-marketing-label"></span>
      </label>
      <label class="agree-row agree-sub">
        <input type="checkbox" id="agree-marketing-night" class="agree-optional" disabled>
        <span id="agree-marketing-night-label"></span>
      </label>
    </div>

    <div class="error" id="error"></div>
    <button type="submit" id="join-submit" class="is-locked" aria-disabled="true"></button>
    <div class="agree-hint" id="agree-hint"></div>
  </form>
  <a class="back" id="back-link" href="/login"></a>

  <script src="/js/app.js?v=20261027"></script>
  <script src="/js/i18n.js?v=20261027"></script>
  <script>
    renderLangSelect(document.getElementById('lang-select'));
    document.getElementById('join-heading').textContent = t('joinHeading');
    document.getElementById('memberId').placeholder = t('memberIdPlaceholder');
    document.getElementById('password').placeholder = t('joinPasswordPlaceholder');
    document.getElementById('nickname').placeholder = t('nicknamePlaceholder');
    document.getElementById('email').placeholder = t('emailPlaceholder');
    document.getElementById('agree-all-label').textContent = t('agreeAll');
    document.getElementById('agree-terms-label').textContent = t('agreeTerms');
    document.getElementById('agree-terms-link').textContent = t('viewDoc');
    document.getElementById('agree-privacy-label').textContent = t('agreePrivacy');
    document.getElementById('agree-privacy-link').textContent = t('viewDoc');
    document.getElementById('agree-location-label').textContent = t('agreeLocation');
    document.getElementById('agree-location-link').textContent = t('viewDoc');
    document.getElementById('agree-note').textContent = t('agreeLocationNote');
    document.getElementById('agree-push-label').textContent = t('agreeOptionalTag') + ' ' + t('ncPushTitle');
    document.getElementById('agree-marketing-label').textContent = t('agreeOptionalTag') + ' ' + t('ncMarketingTitle');
    document.getElementById('agree-marketing-night-label').textContent = t('agreeOptionalTag') + ' ' + t('ncMarketingNightTitle');
    document.getElementById('join-submit').textContent = t('joinSubmit');
    document.getElementById('back-link').textContent = t('backToLogin');
    document.getElementById('agree-hint').textContent = t('joinAgreeHint');
    // 약관 보기 링크를 선택한 언어의 문서로 (/{lang}/terms 등 10개 언어 모두 존재)
    ['terms', 'privacy', 'location-terms'].forEach(function (doc) {
      var id = doc === 'location-terms' ? 'agree-location-link' : 'agree-' + doc + '-link';
      document.getElementById(id).href = '/' + getLang() + '/' + doc;
    });

    var requiredBoxes = Array.prototype.slice.call(document.querySelectorAll('.agree-required'));
    var optionalBoxes = Array.prototype.slice.call(document.querySelectorAll('.agree-optional'));
    var allBoxes = requiredBoxes.concat(optionalBoxes);
    var marketingBox = document.getElementById('agree-marketing');
    var marketingNightBox = document.getElementById('agree-marketing-night');
    var allBox = document.getElementById('agree-all');
    var submitBtn = document.getElementById('join-submit');

    var hintEl = document.getElementById('agree-hint');
    var agreeBox = document.querySelector('.agree-box');
    // disabled 속성 대신 잠금 스타일만 준다 — disabled 버튼은 클릭 이벤트가 오지 않아 "왜 안 눌리는지" 안내할 수 없기 때문.
    function allAgreed() {
      return requiredBoxes.every(function (b) { return b.checked; });
    }
    function updateSubmitState() {
      var ok = allAgreed();
      submitBtn.classList.toggle('is-locked', !ok);
      submitBtn.setAttribute('aria-disabled', ok ? 'false' : 'true');
      hintEl.hidden = ok;
      if (ok) agreeBox.classList.remove('highlight');
    }
    // 야간 수신은 마케팅 수신에 동의했을 때만 켤 수 있다
    function syncMarketingNight() {
      marketingNightBox.disabled = !marketingBox.checked;
      if (!marketingBox.checked) marketingNightBox.checked = false;
    }
    // 전체 동의 = 필수 + 선택 모두. 가입 버튼 잠금은 필수 3개만 본다.
    allBox.addEventListener('change', function () {
      allBoxes.forEach(function (b) { b.checked = allBox.checked; });
      syncMarketingNight();
      updateSubmitState();
    });
    allBoxes.forEach(function (b) {
      b.addEventListener('change', function () {
        if (b === marketingBox) syncMarketingNight();
        allBox.checked = allBoxes.every(function (x) { return x.checked; });
        updateSubmitState();
      });
    });

    document.getElementById('join-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!allAgreed()) {
        // 잠긴 상태에서 누르면 동의 박스를 강조해 어디를 체크해야 하는지 보여준다
        agreeBox.classList.add('highlight');
        agreeBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      var errorEl = document.getElementById('error');
      errorEl.textContent = '';

      join({
        memberId: document.getElementById('memberId').value.trim(),
        password: document.getElementById('password').value,
        nickname: document.getElementById('nickname').value.trim() || null,
        email: document.getElementById('email').value.trim() || null,
        agreedTerms: document.getElementById('agree-terms').checked,
        agreedPrivacy: document.getElementById('agree-privacy').checked,
        agreedLocation: document.getElementById('agree-location').checked,
        agreedPushService: document.getElementById('agree-push').checked,
        agreedMarketing: marketingBox.checked,
        agreedMarketingNight: marketingNightBox.checked
      })
        .then(function (data) {
          storeAuth(data);
          redirectAfterAuth();
        })
        .catch(function (err) {
          errorEl.textContent = err.message || t('joinFailed');
        });
    });
  </script>
</body>
</html>
